const SPR_OF={"The Spoon Man":"coll","Wren":"wren","Maribel":"maribel","Pip":"pip","Marlo":"marlo","Old Greta":"greta","Bram":"bram","Sable":"sable","Voss":"voss",
  "Ember Knight":"knight","Kobold Foreman":"kobold","Celestial Executor":"executor","Village Kid":"kid","Townsfolk":"town","Adventurer":"adv",
  "Collector":"coll","Noble":"noble","Traveler":"trav","Craftsperson":"craft","Scholar":"schol",
  "Cellar Rat":"rat","Slime":"slime","Moss Beetle":"beetle","Cave Bat":"bat","Kobold Miner":"miner","Rock Crab":"crab",
  "Fire Imp":"imp","Ash Wraith":"wraith","Magma Hound":"hound","Star Wisp":"wisp","Spire Sentinel":"sentinel","Void Drake":"drake",
  "Slime Monarch":"monarch","Cinder Colossus":"colossus","Astral Wyrm":"wyrm","Rat Matriarch":"matriarch","Tunnel Wurm":"tunnelwurm",
  "Prism Golem":"prism","Celestial Enforcer":"enforcer","Echo of Voss":"voss"};
const sprCache={};
function sprSVG(k){
  if(sprCache[k])return sprCache[k];
  const d=SPR[k],g=d.g,on=(x,y)=>x>=0&&x<16&&y>=0&&y<16&&g[y*16+x]!==".";
  const colAt=(x,y)=>g[y*16+x]!=="."?d.p[g[y*16+x]]:(on(x+1,y)||on(x-1,y)||on(x,y+1)||on(x,y-1))?"#0e1216":null;
  let r="";
  for(let y=0;y<16;y++)for(let x=0;x<16;){const c=colAt(x,y);if(!c){x++;continue}let w=1;while(x+w<16&&colAt(x+w,y)===c)w++;
    r+=`<rect x="${x}" y="${y}" width="${w}" height="1" fill="${c}"/>`;x+=w}
  return sprCache[k]=`<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" focusable="false">${r}</svg>`;
}
function sprKey(who){
  who=who.replace(/^Elite /,"");
  if(SPR[who])return who;if(SPR_OF[who])return SPR_OF[who];
  if(typeof REGS!=="undefined")for(const t in REGS)if(REGS[t].includes(who))return t; // regulars look like their customer type
  return null;
}
const portrait=(who,cls="")=>{const k=sprKey(who);return k?`<span class="spr ${cls}">${sprSVG(k)}</span>`:""};

const ITEM_USE={
 rope:"Combat only. Escape any fight at once, bosses included, without taking a hit.",
 pick:"Opens a locked chest every time. Without one you have to force it: a 55% chance, with a needle trap if it fails.",
 ladder:"Between fights, climb down one floor without finding the stairs. It doesn't work on the deepest or a secret floor, or past a sealed floor. It's used up only when it works."};
function itemUse(k){
  if(isWhet(k)){const r=whetRank(k),nx=WHET[r+1];
    return `Hone your blade for <b>+${Math.round(WHET[r].b*100)}% attack</b> for the rest of this delve. Only one whetstone of any kind works per delve, so carry spares for later delves. In a fight it uses your turn.${nx?` Stronger whetstones: each rank of Master Grindstone in the Upgrades tab unlocks the next recipe (next: ${IT[nx.k].n}, +${Math.round(nx.b*100)}%).`:" The finest edge there is."}`}
  if(isBomb(k)){const r=bombRank(k),nx=BOMB[r+1];
    return `Combat only. Deals <b>${fmt(bombDmg(k))} damage</b> ${S.run?"here":"at your current attack"} (${BOMB[r].m}× your attack, never less than a deeper floor's blast). Uses your turn.${nx?` Stronger bombs: each rank of Blasting Powder in the Upgrades tab unlocks the next recipe (next: ${IT[nx.k].n}, ${nx.m}×).`:" The strongest bomb there is."}`}
  if(HEAL[k])return `Restores ${Math.round(HEAL[k]*100)}% of your max HP. Drink it from your belt or your pack whenever you're hurt; in a fight it uses your turn.`;
  return ITEM_USE[k]||"";
}
function itemWhere(k){
  const it=IT[k],out=[],dn=t=>DUN.map((d,i)=>({d,i})).filter(({d,i})=>d.t===t&&(!d.hidden||dunOpen(i))).map(({d})=>"the "+d.n);
  const list=a=>a.length>1?a.slice(0,-1).join(", ")+" or "+a.at(-1):a[0];
  if(it.sec)out.push(`Found only on the secret floor of ${list(dn(it.t))}, past the boss's lair.`);
  else if(it.c==="supply"){if(k!=="ladder"&&(!isBomb(k)||k==="bomb")&&(!isWhet(k)||k==="whet"))out.push("Dropped by bosses and mini-bosses, and sold by peddlers you meet while delving.")}
  else if(!it.craft){
    const near=[...dn(it.t-1),...dn(it.t+1)];
    out.push(`Found in ${list(dn(it.t))}${near.length?`, and now and then in ${list(near)}`:""}.`);
    if(it.c==="potion")out.push(`Peddlers in ${list(dn(it.t))} sell them too.`);
  }
  const r=RECIPES.find(x=>x.out===k);
  if(r){const parts=[...Object.entries(r.items).map(([q,n])=>`${n} ${IT[q].n}`),...Object.entries(r.mats).map(([m,n])=>`${n} ${MATS[m]}`)],lock=recipeLock(r);
    out.push(`${it.craft?"Boss craft":"Craft it"} in the Workshop: ${parts.join(" + ")}.${lock?` ${lock}.`:""}`)}
  return out;
}

    </div>`}).join("");

        <span class="sub">${s.bio} ${stats(s.k)}</span><span class="right">Hire</span></button>`
      :`<div class="row locked"><span><b>???</b> <span class="sub">${R_(s.title)}</span></span><span class="sub">${s.lock}</span><span class="right sub">Locked</span></div>`}).join("")}</div>`:""}

function vWork(){

  const recs=RECIPES.map((r,i)=>({r,i})).filter(({r})=>IT[r.out].t<=ut+1&&!(isBomb(r.out)&&bombRank(r.out)>powder()+1)&&!(isWhet(r.out)&&whetRank(r.out)>grind()+1)).sort((a,b)=>canCraft(b.r)-canCraft(a.r));
  const part=(name,need,have)=>`<span class="${have>=need?"have":"need"}">${need} ${name}</span> (${have})`;
  return `
  <section><h2>Materials <small>crafting doesn't use the day</small></h2>
    <div class="chips">${mats.length?mats.map(([k,n])=>`<span class="chip mat">${MATS[k]} ×${n}</span>`).join(""):`<span class="hint">Defeat monsters and search walls in dungeons to gather materials.</span>`}</div></section>
  <section><h2>Recipes</h2><div class="list">
    ${recs.map(({r,i})=>{const o=IT[r.out];const parts=[...Object.entries(r.items).map(([k,n])=>part(IT[k].n,n,count(S.inv,k))),...Object.entries(r.mats).map(([k,n])=>part(MATS[k],n,S.mats[k]||0))];
      return `<button class="row" data-act="craft" data-i="${i}"${dis(!canCraft(r))}>
        <span><b>${o.n}</b>${ii(r.out)}<span class="${o.craft?"crown":"cat"}">${o.craft?"boss craft":o.c}</span></span>
        <span class="sub">${recipeLock(r)?`<span class="need">${recipeLock(r)}</span> · `:""}${parts.join(" + ")}</span>
        <span class="right coin">${val(r.out)}G</span></button>`}).join("")}
  </div><p class="hint" style="margin-top:8px">More recipes appear as you unlock deeper dungeons.</p></section>`;
}

function evButtons(){
  const R=S.run,E=R.ev,b=(c,label,cls="",off=false)=>`<button class="btn ${cls}" data-act="ev" data-c="${c}"${dis(off)}>${label}</button>`;
  switch(E.type){
    case "chest":return (S.belt.includes("pick")?b("pick","Use lockpick","gold"):"")+b("force","Force it open (55%)")+b("leave","Leave it","alt");
    case "merchant":return E.offers.map((o,i)=>o.sold?"":b("buy"+i,`${IT[o.k].n} · ${fmt(o.p)}G${ii(o.k)}`,"gold",S.gold<o.p)).join("")+b("leave","Move on","alt");
    case "shrine":return b("offer","Offer blood (−20% HP, +25% attack)","danger")+b("leave","Walk away","alt");
    case "sleeper":return b("sneak",`Sneak past (${Math.round(sneakCh()*100)}%)`)+b("ambush","Ambush it (triple damage)","danger");
    case "fountain":return b("drink","Drink from it")+b("leave","Leave it","alt");

  return b("leave","Move on","alt");
}

/* Shrink big pixel-font numbers to fit their box on narrow phones instead of cutting them off. */
function fitText(){
  for(const el of app.querySelectorAll(".stat b,.offerbox b,.price b,.big-num")){
    el.style.fontSize="";let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
    const room=()=>el.parentElement.clientWidth-parseFloat(getComputedStyle(el.parentElement).paddingLeft)-parseFloat(getComputedStyle(el.parentElement).paddingRight);
    while(el.scrollWidth>Math.max(el.clientWidth,room())+.5&&fs>9&&n<20){fs-=1;el.style.fontSize=fs+"px";n++}
  }
}
addEventListener("resize",()=>fitText());
try{document.fonts.ready.then(()=>fitText());document.fonts.addEventListener("loadingdone",()=>fitText())}catch(e){}
function render(){
  if(S.over)app.innerHTML=vOver();
  else if(S.run)app.innerHTML=vDelve();
  else if(S.shop)app.innerHTML=vShop();
  else{
    if((tab==="skills"&&!fl("skills"))||tab==="legacy")tab=tab==="legacy"?"journal":"town";
    app.innerHTML=`<header><h1>Dungeon Loot Shoppe</h1>${soundBtn()}</header>${topStats()}${tabs()}`+(tab==="work"?vWork():tab==="upg"?vUpg():tab==="skills"?vSkills():tab==="journal"?vJournal():vTown());
  }
  applyHl();fitText();
  const r=document.getElementById("price");
  if(r)r.addEventListener("input",()=>{S.shop.pct=+r.value;const p=Math.max(1,Math.round(val(S.shop.cur.k)*S.shop.pct/100));
    document.getElementById("pv").textContent=fmt(p)+"G";fitText();document.getElementById("pp").textContent=S.shop.pct+"% of market"});
  musicUpdate();applyTheme();
}

    ev:()=>evChoice(b.dataset.c), use:()=>useItem(b.dataset.s,+b.dataset.i),
    drop:()=>dropPick(+b.dataset.i), pickup:pickUp,
    equip:()=>equip(b.dataset.k), unequip:()=>unequip(+b.dataset.i), secret:secretStairs,
    learn:()=>learn(b.dataset.k),
    info:()=>{infoK=b.dataset.k;drawOv()}, nextCh:nextChapter, sleep:sleepNight, council:holdCouncil,
    payDebt, repair:()=>repair(b.dataset.k), forge, theme:()=>{S.theme=b.dataset.k;applyTheme();save();render()},
    hire:()=>hire(b.dataset.k), fireAsk:()=>{confirmFire=b.dataset.k;render()}, fireNo:()=>{confirmFire=null;render()}, fireDo:()=>fire(b.dataset.k),
    keep:()=>{const k=b.dataset.k;S.keep[k]=!isKept(k);save();render()},
    reportOk:()=>{S.report=null;save();render()},
    raiseYes:()=>{const k=S.report.raise,rec=staffRec(k);rec.wageB+=.2;rec.rateB+=.05;toast(`${ST(k).n} beams. <b>+5% prices</b>, wage now ${fmt(staffWage(k))}G.`);sfx.coin();S.report=null;save();render()},
    raiseNo:()=>{toast(`${ST(S.report.raise).n} sighs and gets back to work.`);S.report=null;save();render()},
    perk:()=>buyPerk(b.dataset.k),
    reopen:askReopen, payLoan:()=>payLoan(false), payLoanAll:()=>payLoan(true),
    quick:()=>{const k=b.dataset.k;if(!sk("quick")||!S.inv.includes(k))return;const p=quickPrice(k);
      S.inv.splice(S.inv.indexOf(k),1);S.gold+=p;S.earned+=p;S.sold++;sfx.coin();toast(`Sold ${an(IT[k].n)} for <b>${fmt(p)}G</b>.`);SE("sold",{n:1,g:p});save();render()},
    explore, attack, guard, flee, descend, boss:challengeBoss, leave:leaveDungeon,
    offer, accept:()=>sell(S.shop.cur.counter), acceptOffer:()=>sell(S.shop.cur.offer), haggle:startHaggle, refuse:letWalk, pitchTalk, pitchSweet, close:endDay,
    updateGame:async()=>{
      save();toast("Checking for updates…");
      try{if(navigator.serviceWorker){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.update().catch(()=>{})))}}catch(e){}
      try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
      location.reload();
    },
    exportSave:()=>{
      save();saveCode="LS1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));saveBox="export";
      const done=ok=>{saveMsg=ok?"Copied to your clipboard. Paste it somewhere safe, like a note.":"Select the code below and copy it.";render();if(!ok){const t=document.getElementById("exportCode");t&&t.select()}};
      try{navigator.clipboard.writeText(saveCode).then(()=>done(true),()=>done(false))}catch(e){done(false)}
    },
    importOpen:()=>{saveBox="import";saveMsg="";render();document.getElementById("importCode")?.focus()},
    saveClose:()=>{saveBox=null;saveMsg="";render()},
    importDo:()=>{
      const raw=(document.getElementById("importCode")?.value||"").replace(/\s+/g,"");
      try{
        if(!/^ls1:/i.test(raw))throw 0; // some phones lowercase the start of a pasted line
        const o=JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));
        if(!o||typeof o.day!=="number"||!Array.isArray(o.inv))throw 0;
        const snd=S.sound,mus=S.music;S=loadState(o);S.sound=snd;S.music=mus;migrate();save();
        saveBox=null;saveMsg=`Save loaded: day ${S.day}, level ${lvl()}, ${fmt(S.gold)}G.`;sfx.lvl();render();
      }catch(e){saveMsg="That isn't a valid Dungeon Loot Shoppe save code. Make sure you copied all of it, starting with LS1:.";render()}
    },
    reset:()=>{confirmReset=true;render()}, resetNo:()=>{confirmReset=false;render()},
    resetYes:()=>{const s=S.sound;S=fresh();S.sound=s;confirmReset=false;save();render()},
    restart:()=>{const s=S.sound;S=fresh();S.sound=s;save();render()}
  })[a]?.();
  if(hlDone){save();render();playNext()}
});
app.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList?.contains("ii")){e.preventDefault();e.target.click()}});
document.getElementById("ov").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  if(S.sound||S.music)audioCtx();
  if(b.dataset.act==="infoOk"){infoK=null;drawOv();return}
  if(b.dataset.act==="tipOk"){const id=tipOpen;S.story.tipQ=S.story.tipQ.filter(x=>x!==id);tipOpen=null;if(TIPS[id]&&TIPS[id].hl)hlSet(id);drawOv();save();render();playNext();return}
  if(b.dataset.act==="scn")scnGo(b.dataset.go);
});
document.addEventListener("pointerdown",()=>{if(S.music&&!ac){audioCtx();musicUpdate()}},{once:true});
document.addEventListener("visibilitychange",()=>{
  if(!ac)return;
  if(document.hidden)ac.suspend();else{ac.resume();M.next=ac.currentTime+.08}
});
render();
playNext();
</script>

<script>
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
