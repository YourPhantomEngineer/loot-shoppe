<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dungeon Loot Shoppe</title>
<meta name="description" content="A cozy dungeon-delving shopkeeping game. Explore dungeons for loot, then haggle it away in your shop.">
<meta name="theme-color" content="#0f2326">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dungeon Loot Shoppe">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Karla:wght@400;600;700&display=swap">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one-column phone app; town has three tabs (Town, Workshop, Skills), plus dungeon and shop screens. Single deliberate look: deep teal stone, copper fittings, coin gold. */
:root{
  --bg:#0f2326; --panel:#17333a; --line:#24474f; --fg:#eef2e6; --muted:#93b0aa;
  --copper:#e0904f; --coin:#f2c94c; --hp:#e06a5a; --good:#7fd18b; --bad:#e06a5a; --arcane:#9fb7f0;
  --display:"Silkscreen","Courier New",monospace; --body:"Karla",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0;color:var(--copper);text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:.85rem;margin:0 0 8px;color:var(--muted);letter-spacing:.04em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font:600 .78rem var(--body);color:var(--muted);text-align:right}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;padding:9px 10px;min-height:44px;border-radius:4px;cursor:pointer}
.ghost[aria-pressed="true"]{color:var(--coin);border-color:var(--coin)}
.tools{display:flex;gap:6px;flex-shrink:0}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border-radius:8px;padding:4px;gap:4px}
.tabs button{border:0;background:none;color:var(--muted);font:700 .78rem var(--body);padding:9px 1px;min-height:44px;border-radius:6px;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{background:var(--line);color:var(--fg)}
.tabs button{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.76rem!important}
.tabs .dot{position:absolute;top:1px;right:1px;margin:0;min-width:15px;line-height:15px;font-size:.62rem;padding:0 4px}
.dot{display:inline-block;vertical-align:1px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--coin);color:#2a2008;font-size:.7rem;margin-left:4px;line-height:18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border-radius:6px;padding:10px;min-width:0}
.lbl{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat b{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums;display:block;margin-top:2px;white-space:nowrap;overflow:hidden}
.xpstat .lbl{font-size:.62rem;letter-spacing:.06em;white-space:nowrap}.xpstat b{font-size:.82rem;letter-spacing:-.02em}
.coin{color:var(--coin)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--copper)}
.bar.hp i{background:var(--hp)}
.rent{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:.88rem;display:flex;justify-content:space-between;gap:10px;align-items:center}
.rent.urgent{border-color:var(--bad)}
.rent b{color:var(--coin);font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
button.chip{min-height:44px}
.chip.up{border-color:var(--good);color:var(--good)} .chip.down{border-color:var(--bad);color:var(--bad)}
.chip.mat{border-color:var(--arcane);color:var(--arcane)}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--copper);color:#24130a;border:0;border-radius:8px;padding:14px 16px;font-weight:700;font-size:1.05rem;cursor:pointer}
.big small{font-weight:600;font-size:.8rem;opacity:.8}
.big:disabled{background:var(--line);color:var(--muted);cursor:default}
.big[aria-disabled="true"]{background:var(--line);color:var(--muted);cursor:default}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);text-align:left;font:inherit;width:100%}
button.row{cursor:pointer}
button.row:disabled{cursor:default}
button.row[aria-disabled="true"]{cursor:default}
button.row:disabled>*{opacity:.5}
button.row[aria-disabled="true"]>*{opacity:.5}
.row .sub{font-size:.8rem;color:var(--muted)}
.row .right{grid-row:1/3;grid-column:2;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.row .right.coin{font-family:var(--display);font-weight:400}
.have{color:var(--good)} .need{color:var(--bad)}
.cat{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--copper);margin-left:6px}
.crown{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--coin);margin-left:6px}
.card{background:var(--panel);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.event{font-size:1.05rem;font-weight:600;min-height:2.8em}
.monster{border:1px solid var(--bad);border-radius:6px;padding:10px 12px}
.monster.boss{border-width:2px;background:rgba(224,106,90,.08)}
.monster b{color:var(--bad)}
.monsterhead{display:flex;align-items:center;gap:12px}
.monsterinfo{flex:1;min-width:0}
.spr.foe{width:64px;height:64px;border-color:var(--bad);background:rgba(224,106,90,.08)}
.warn{color:var(--coin);font-weight:700;font-size:.85rem;margin:6px 0 0}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.btn{border:0;border-radius:6px;padding:12px;min-height:44px;font-weight:700;font-size:.95rem;cursor:pointer;background:var(--copper);color:#24130a}
.btn:disabled,.btn.gold:disabled,.btn.danger:disabled,.btn.alt:disabled{background:var(--line);color:var(--muted);cursor:default;opacity:.6}
.btn[aria-disabled="true"],.btn.gold[aria-disabled="true"],.btn.danger[aria-disabled="true"],.btn.alt[aria-disabled="true"]{background:var(--line);color:var(--muted);cursor:default;opacity:.6}
.usebtn{background:none;color:var(--fg);cursor:pointer;font-family:inherit}
.usebtn.on{border-color:var(--coin);color:var(--coin)}
.usebtn:disabled{opacity:.45;cursor:default}
.usebtn[aria-disabled="true"]{opacity:.45;cursor:default}
.chip.dropsel{border-color:var(--bad);color:var(--bad);background:rgba(224,106,90,.1)}
.leftbox{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--coin);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:.88rem}
.chip.rare{border-color:var(--coin);color:var(--coin)}
.modbar{border:1px solid var(--arcane);color:var(--arcane);border-radius:6px;padding:8px 12px;font-size:.85rem}
.modbar b{font-family:var(--display);font-weight:400}
.btn.sm{padding:7px 10px;font-size:.82rem}
.btn.alt{background:var(--line);color:var(--fg)}
.btn.danger{background:var(--bad);color:#2a0d08}
.btn.gold{background:var(--coin);color:#2a2008}
.bag{display:flex;flex-wrap:wrap;gap:6px}
.log{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.log li:first-child{color:var(--fg)}
.quote{font-size:1.02rem;font-style:italic;margin:0}
.spr{display:inline-block;flex:none;width:40px;height:40px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.spr svg{width:100%;height:100%;display:block}
.spr.lg{width:52px;height:52px}.spr.sm{width:34px;height:34px}
.sline.wp{display:flex;gap:10px;align-items:flex-start}
.whorow{display:inline-flex;align-items:center;gap:10px;min-width:0}
.ii{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;border:1px solid currentColor;border-radius:50%;font:700 .68rem/1 var(--body);font-style:normal;color:var(--muted);vertical-align:middle;cursor:pointer;flex:none}
.ii::after{content:"";position:absolute;inset:-10px}
.ii:hover,.ii:focus-visible{color:var(--coin)}
.mhp{display:block;margin-top:4px;font-size:.8rem;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.buff{display:block;margin-top:6px;font-size:.78rem;font-weight:700;color:var(--coin)}
.goalbtn{margin-top:8px}
.chend{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.chend .hint{margin:0}
.custhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mood{font-size:.78rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.mood.eager{color:var(--coin);border-color:var(--coin)} .mood.keen{color:var(--good);border-color:var(--good)}
.mood.fair{color:var(--muted)} .mood.thrifty{color:var(--bad);border-color:var(--bad)}
.tell{margin:0;color:var(--muted);font-size:.9rem}
.offerbox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.offerbox b{font-family:var(--display);font-size:1.6rem;color:var(--coin);font-variant-numeric:tabular-nums}
.who{font-family:var(--display);font-size:.8rem;color:var(--copper)}
.price{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price b{font-family:var(--display);font-size:1.6rem;color:var(--coin);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--coin);height:28px}
.fb{font-weight:700;min-height:1.3em;margin:0}
.fb.bad{color:var(--bad)}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.branch{border:1px solid var(--line);border-radius:8px;padding:12px 12px 4px}
.branch h3{font-family:var(--display);font-size:.9rem;margin:0;color:var(--copper);display:flex;justify-content:space-between}
.branch h3 small{font:600 .75rem var(--body);color:var(--muted)}
.pips{letter-spacing:2px;color:var(--coin)}
.code{display:block;width:100%;box-sizing:border-box;min-height:84px;margin-top:6px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,monospace;word-break:break-all;resize:vertical;-webkit-user-select:text;user-select:text}
.starnum{font-family:var(--display);font-size:1.6rem;color:var(--coin);display:block}
.tag{font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--good);color:var(--good);background:none;border-radius:999px;padding:2px 8px;min-height:44px;margin-left:4px;cursor:pointer}
.tag.keep{border-color:var(--muted);color:var(--muted)}
.report{border:1px solid var(--coin)}
.rlog li{color:var(--fg)}
.staffcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.row.locked{opacity:.55}
.town-view{display:flex;flex-direction:column;gap:14px}
.town-section{--town-accent:var(--copper);position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 54%),var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:inset 3px 0 0 var(--town-accent),0 4px 0 rgba(5,14,16,.22)}
.town-section::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--town-accent);opacity:.72}
.town-section h2{color:var(--town-accent);border-bottom:1px solid var(--line);padding:0 2px 10px;margin:0 0 12px}
.town-market{--town-accent:var(--coin)}
.town-expedition{--town-accent:var(--copper)}
.town-staff{--town-accent:var(--good)}
.town-supplies{--town-accent:var(--arcane)}
.town-stock{--town-accent:var(--coin)}
.town-utility{--town-accent:var(--muted)}
.town-action{padding:4px;border:1px solid var(--copper);border-radius:11px;background:rgba(224,144,79,.09);box-shadow:0 4px 0 rgba(5,14,16,.22)}
.town-action .big{box-shadow:inset 0 1px rgba(255,255,255,.18)}
.town-ledger{border:1px dashed var(--line);border-radius:8px;padding:9px 12px;text-align:center;background:rgba(5,14,16,.12)}
html[data-shop="festival"]{--bg:#2a1418;--panel:#3a1d22;--line:#58303a;--copper:#ee6f5a;--coin:#f7c95a;--muted:#c49ea0}
html[data-shop="starlight"]{--bg:#0f1530;--panel:#18204a;--line:#2a3468;--copper:#9fb7f0;--coin:#e4e9f7;--muted:#9aa6cf}
.ov[hidden]{display:none}
.ov{position:fixed;inset:0;z-index:30;background:rgba(5,14,16,.72);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovcard{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--copper);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;
  max-height:80vh;overflow-y:auto;animation:ovin .25s ease}
@keyframes ovin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.ovtitle{font-family:var(--display);font-size:.8rem;color:var(--copper);letter-spacing:.04em}
.narr{margin:0;font-size:1.02rem;line-height:1.5}
.letter{margin:0;font-style:italic;font-family:Georgia,serif;font-size:1.02rem;line-height:1.5;border-left:3px solid var(--coin);padding-left:12px}
.sline{margin:0;line-height:1.5}
.who{font-family:var(--display);font-weight:400;color:var(--copper);font-size:.85rem;margin-right:4px}
.aside{color:var(--muted)}
body.ovopen{overflow:hidden}
.tutcall{position:relative;background:var(--coin);color:#2a2008;font-weight:700;border-radius:8px;padding:10px 12px;margin:10px 0 8px;font-size:.92rem}
.tutcall::after{content:"";position:absolute;left:24px;bottom:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--coin)}
.hl{outline:2px solid var(--coin);outline-offset:2px;border-radius:6px;animation:hlpulse 1.4s ease-in-out infinite}
.row.hl,.tabs .hl,section.hl{outline-offset:-2px}
@keyframes hlpulse{50%{box-shadow:0 0 0 5px rgba(242,201,76,.28);background-color:rgba(242,201,76,.12)}}
@media (prefers-reduced-motion:reduce){.hl{animation:none}}
.tipcard{max-width:420px}
.tipbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--copper);border-radius:8px;padding:10px 12px}
.tipbar p{margin:0;font-size:.92rem;line-height:1.45}
.tipbar .ghost{flex-shrink:0}
.jcard{gap:8px}
.jtitle{font-family:var(--display);font-size:1.05rem;color:var(--fg);margin:0}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.goal{display:flex;gap:8px;align-items:baseline;font-size:.93rem}
.goal .gk{width:1.1em;color:var(--muted);flex-shrink:0;text-align:center}
.goal.done{color:var(--muted)}.goal.done .gk{color:var(--good)}
.egs .eg{display:flex;flex-direction:column;gap:2px;font-size:.93rem}.eg>span{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.eg .egp{white-space:nowrap;font-variant-numeric:tabular-nums}.eg .right{white-space:nowrap;font-family:var(--display);font-size:.8rem}
.entries{display:flex;flex-direction:column;gap:10px}
.entry{margin:0;font-family:Georgia,serif;font-style:italic;line-height:1.5;border-left:2px solid var(--line);padding-left:10px}
.entry.done{border-color:var(--coin)}.entry.open{border-color:var(--copper)}.entry.note{border-color:var(--arcane)}
.loanpay{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.loanpay input{width:90px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px;font:inherit}
.confirm{border:1px solid var(--bad);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.88rem;text-align:center}
.over{text-align:center;gap:14px}
.over .big-num{font-family:var(--display);font-size:2.4rem;color:var(--coin)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 80px));opacity:0;visibility:hidden;background:var(--panel);border:1px solid var(--coin);border-radius:8px;padding:10px 16px;font-size:.88rem;max-width:calc(100% - 32px);transition:transform .3s ease,opacity .3s ease,visibility 0s linear .3s;z-index:20;text-align:center}
#xpPop{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0px));left:50%;margin-left:-60px;width:120px;text-align:center;box-sizing:border-box;z-index:21;pointer-events:none;
  background:var(--panel);border:1px solid var(--copper);color:var(--copper);font:700 .9rem var(--display);padding:6px 12px;border-radius:999px;
  opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
#xpPop.show{opacity:1;transform:none;animation:xpbump .35s ease}
.stat.daypop{position:relative;z-index:2;animation:daypop 1.8s cubic-bezier(.2,.9,.3,1) var(--dpd,0s) both}
.stat.daypop b{animation:daynum 1.8s cubic-bezier(.2,.9,.3,1) var(--dpd,0s);display:inline-block;transform-origin:left center}
.stat.daypop::after{content:"New day!";position:absolute;left:50%;top:-6px;transform:translateX(-50%);white-space:nowrap;background:var(--coin);color:#2a2008;font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:999px;pointer-events:none;animation:daytag 1.8s ease-out var(--dpd,0s) both}
@keyframes daypop{0%{transform:scale(1);background:var(--coin);box-shadow:0 0 0 0 rgba(242,201,76,.9)}
 18%{transform:scale(1.18);background:rgba(242,201,76,.55);box-shadow:0 0 0 10px rgba(242,201,76,.35)}
 40%{transform:scale(1.06);box-shadow:0 0 0 18px rgba(242,201,76,0)}
 100%{transform:scale(1);background:var(--panel);box-shadow:0 0 0 0 rgba(242,201,76,0)}}
@keyframes daynum{0%{transform:scale(1)}20%{transform:scale(2.1);color:var(--coin)}45%{transform:scale(1.5);color:var(--coin)}100%{transform:scale(1)}}
@keyframes daytag{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}70%{opacity:1;transform:translate(-50%,-18px) scale(1)}100%{opacity:0;transform:translate(-50%,-26px) scale(1)}}
@media (prefers-reduced-motion:reduce){.stat.daypop,.stat.daypop b,.stat.daypop::after{animation:none}.stat.daypop::after{display:none}}
@keyframes xpbump{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#xpPop,#xpPop.show{transition:none;animation:none}}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s ease,opacity .3s ease}
#toast b{color:var(--coin)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#hagglePop{position:fixed;left:50%;top:42%;z-index:40;pointer-events:none;visibility:hidden;max-width:calc(100% - 48px);box-sizing:border-box;
  background:var(--panel);border:2px solid var(--coin);border-radius:999px;padding:8px 14px;color:var(--coin);font:700 .8rem var(--display);text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.45)}
#hagglePop.good{border-color:var(--good);color:var(--good)}#hagglePop.bad{border-color:var(--bad);color:var(--bad)}
#hagglePop.show{visibility:visible;animation:hagglefloat 2s ease-out both}

/* ================= Story engine ================= */
/* Scenes are data: an ID, a trigger (on + when), cards, and effects (done).
   A card is {s:[...], b:"Button"} or {s:[...], c:[["Label","nextCardId"],...]}.
   s items: "narration" | ["note","letter text"] | ["Speaker","line","stage direction"].
   Every scene, tip and intro plays once; seen flags live in S.story. */
/* Maribel's debt: one payment per chapter (Ch2-5), each sized to that chapter's earnings. */
const DEBT_SCHEDULE=[1000,5000,15000,40000], DEBT_PAYMENTS=DEBT_SCHEDULE.length;

   (the Celestials 50%, Hollowmere Mutual 25%). You repay the cash plus interest. */
const LOAN_CASH={2:500,3:1500,4:4000,5:10000,6:15000};
const loanRate=()=>seen("4.4")?.25:.5;
const loanCash=()=>LOAN_CASH[S.story.ended?6:Math.min(6,Math.max(2,S.story.ch))];
const loanOwed=()=>Math.round(loanCash()*(1+loanRate()));

function jrnl(text,kind="entry"){S.story.journal.push({ch:S.story.ch,day:S.day,text,kind})}

function queue(id){const st=S.story,sc=SCN[id];if(!sc||(!sc.repeat&&st.seen[id])||st.queue.includes(id))return;st.queue.push(id)}

/* ---------- Chapters and goals ---------- */
const chGoals=c=>(CH[c]&&CH[c].goals)||[];
function goalEvent(type,d){
  const st=S.story;
  for(const g of chGoals(st.ch))if(!st.goals[g.id]&&g.ev&&(!g.can||g.can())&&g.ev(type,d))st.goals[g.id]=S.day;
}
function checkGoals(){
  const st=S.story;
  for(const g of chGoals(st.ch))if(!st.goals[g.id]&&g.ok&&g.ok())st.goals[g.id]=S.day;
}
const chComplete=c=>chGoals(c).length>0&&chGoals(c).every(g=>S.story.goals[g.id]);
function checkChapter(){
  const st=S.story;if(scn||st.queue.length)return;
  if(!chComplete(st.ch)||st.flags["ch"+st.ch+"done"])return;
  st.flags["ch"+st.ch+"done"]=S.day;

  // next morning); Chapter 6 ends with the epilogue, which plays on its own.
  if(st.ch===1)tip("t_ch1done");
  else if(!CH[st.ch].wait)tip("t_chdone"+st.ch);
}
const chReady=()=>{const st=S.story,C=CH[st.ch];return !!C&&!C.wait&&chComplete(st.ch)&&fl("ch"+st.ch+"done")&&!fl("ch"+st.ch+"ended")};

  const st=S.story;st.ch=n;st.chDay=S.day;const C=CH[n];

  const st=S.story,C=CH[st.ch];
  if(C.done)jrnl(R_(C.done),"done");
  if(C.unlock)C.unlock();

  toast(`<b>Chapter ${st.ch} complete:</b> ${C.t}`);
  if(CH[st.ch+1])startChapter(st.ch+1);
}

/* ---------- Events ---------- */
function SE(type,d={}){
  const st=S.story;if(!st)return;
  goalEvent(type,d);
  if(st.endless)egEvent(type,d);
  checkGoals();
  for(const id in SCN){
    const sc=SCN[id];if(sc.repeat||st.seen[id]||st.queue.includes(id))continue;
    if([].concat(sc.on||[]).includes(type)&&(!sc.when||sc.when(Object.assign({_t:type},d))))queue(id);
  }
  tipHooks(type,d);
  checkChapter();
  playNext();
}
function tipHooks(type,d){} // filled in by chapter data

/* ---------- Scene player ---------- */
let scn=null, tipOpen=null;
/* Scenes play first; queued tips, intros and idle lines then pop up one at a time until dismissed. */
function playNext(){
  const st=S.story;if(scn||tipOpen)return;
  const urgent=st.tipQ.find(t=>TIPS[t]&&TIPS[t].urgent);
  if(urgent){tipOpen=urgent;drawOv();return}
  const id=st.queue.find(x=>SCN[x]);
  if(!id){ // scenes from a newer version wait in the queue
    st.tipQ=st.tipQ.filter(t=>TIPS[t]);
    if(hlSpec())return; // one highlight at a time: the next prompt waits until this one is done
    const inTown=!S.run&&!S.shop;
    for(const t of [...st.tipQ]){
      const T=TIPS[t];
      if(T.skip&&T.skip()){st.tipQ=st.tipQ.filter(x=>x!==t);continue}
      if(T.hl&&R_(T.hl).town&&!inTown)continue; // prompts about the town wait until you're back in town
      if(!T.t){st.tipQ=st.tipQ.filter(x=>x!==t);hlSet(t);render();return} // highlight with no card
      tipOpen=t;drawOv();return;
    }
    return;
  }
  const sc=SCN[id];
  if(sc.log){ // log-only scene: lines go into the delve log
    const lines=R_(sc.log);
    if(S.run){for(const l of lines)rlog(l);S.run.event=lines[lines.length-1]+(S.run.event?"<br>"+S.run.event:"")}
    finishScene(id);return;
  }
  scn={id,i:0};drawOv();
}
const cardAt=(id,i)=>R_(SCN[id].cards[i]);
function scnGo(go){
  if(!scn)return;
  const sc=SCN[scn.id],c=cardAt(scn.id,scn.i);
  if(c.c)S.story.choices[scn.id]=go;
  let target=go&&go!=="next"?go:c.next;
  let ni=target?sc.cards.findIndex((x,k)=>cardAt(scn.id,k).id===target):scn.i+1;
  if(c.c&&!target)ni=scn.i+1;
  if(ni<0||ni>=sc.cards.length||c.end)return finishScene(scn.id);
  scn.i=ni;drawOv();
}
function finishScene(id){
  const st=S.story,sc=SCN[id];
  st.queue=st.queue.filter(x=>x!==id);
  if(!sc.repeat)st.seen[id]=S.day;
  scn=null;drawOv();
  if(sc.done)sc.done(st.choices[id]);
  checkGoals();checkChapter();
  save();render();
  playNext();
}
const md=t=>String(t).replace(/\n/g,"<br>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<em>$1</em>");
function cardHTML(c){
  let h="";
  for(const it of R_(c.s)||[]){
    if(typeof it==="string")h+=`<p class="narr">${md(it)}</p>`;
    else if(it[0]==="note")h+=`<p class="letter">${md(it[1])}</p>`;
    else{const pt=portrait(it[0]);h+=`<p class="sline${pt?" wp":""}">${pt}<span><b class="who">${it[0]}</b>${it[2]?` <i class="aside">(${it[2]})</i>`:""} “${md(it[1])}”</span></p>`}
  }
  const btns=c.c?c.c.map(([l,g])=>`<button class="btn" data-act="scn" data-go="${g}">${l}</button>`).join("")
    :`<button class="btn gold" data-act="scn" data-go="next">${c.b||"Continue"}</button>`;
  return h+`<div class="btns">${btns}</div>`;
}
function drawOv(){

    ov.querySelector("button")?.focus({preventScroll:true});return;
  }
  if(!scn){ov.hidden=true;ov.innerHTML="";document.body.classList.remove("ovopen");return}

function tipBar(){

/* ---------- Highlights ---------- */
/* A tip's hl says what to point at once the player taps Got it (a tip with no text is a highlight on its own).
   sel: what to outline. tab: the tab it sits on; if another tab is open, that tab is outlined first.
   town: it lives in town, so it waits while delving or shopping and is dropped when you leave town.
   stay: it stays until tapped (tabs, dungeons, Open the shop); otherwise it shows for that moment, until the next tap.
   call: a callout line above it. first: outline only the first match. */
const TABSEL=t=>`[data-act=tab][data-t="${t}"]`;
const tabHl=t=>({sel:TABSEL(t),town:true,stay:true});
const hlSpec=()=>{const id=S.story&&S.story.hl;if(!id)return null;const T=TIPS[id];
  if(T&&T.skip&&T.skip()){S.story.hl=null;return null} // its moment has passed (e.g. the chapter already moved on)
  return T&&T.hl?R_(T.hl):null};
let hlShown=false,hlScrolled="";
function hlSet(id){S.story.hl=id;hlShown=false;hlScrolled=""}
function hlClear(){if(!S.story||!S.story.hl)return false;S.story.hl=null;hlShown=false;return true}
function applyHl(){
  hlShown=false;
  if(!S.story)return;
  if(S.story.hl&&!hlSpec())S.story.hl=null;
  const H=hlSpec();if(!H||scn||tipOpen)return;
  const inTown=!S.run&&!S.shop&&!S.over;
  if(H.town&&!inTown)return;
  let sel=H.sel,call=H.call,redirect=false;
  if(H.tab&&tab!==H.tab){sel=TABSEL(H.tab);call=null;redirect=true}
  let els=[...app.querySelectorAll(sel)];
  if(!els.length){ // nothing to point at here: drop it so later prompts aren't held up
    if(!redirect){hlClear();save();setTimeout(playNext,0)}
    return;
  }
  if(H.first&&!redirect)els=els.slice(0,1);
  els.forEach(e=>e.classList.add("hl"));
  if(call){const c=document.createElement("div");c.className="tutcall";c.setAttribute("role","status");c.innerHTML=call;els[0].before(c)}
  if(!redirect)hlShown=true;
  const key=S.story.hl+"|"+sel;
  if(hlScrolled!==key){hlScrolled=key;const el=els[0];
    setTimeout(()=>{const r=el.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"})},60)}
}
/* Called on every tap in the game before it's handled. Returns true if the highlight was finished. */
function hlTap(b){
  const H=hlSpec();if(!H)return false;
  if(H.stay){if(b.closest(H.sel))return hlClear()}
  else if(hlShown)return hlClear();
  return false;
}
/* Leaving town (delve or shop) sets a town highlight aside until you're back; tabs and dungeons still wait to be tapped,
   other town highlights are dropped. Ending a delve or shop day drops an in-the-moment highlight. */
function hlLeave(toTown){
  const st=S.story,H=hlSpec();
  if(toTown){if(H&&!H.town)hlClear();if(st.hlPark&&!st.hl){hlSet(st.hlPark)}st.hlPark=null;return}
  if(H&&H.town){if(H.stay)st.hlPark=st.hl;hlClear()}
}

}

/* ---------- Save migration ---------- */
/* Saves from before tutorial highlights: count prompts whose moment has passed as already seen. */
function migrateTut2(st){
  if(st.flags.tut2)return;st.flags.tut2=S.day;
  const g=id=>!!st.goals[id],done=(id,c)=>{if(c)st.tips[id]=st.tips[id]||S.day};
  const cellarWaiting=!!st.flags.tutCellar;delete st.flags.tutCellar;
  if(S.day>1||S.xp>0||S.sold>0||cellarWaiting)st.flags.cellar1=st.flags.cellar1||S.day;
  done("t_journal",st.seen["1.1"]);done("h_cellar",st.seen["1.1"]&&!cellarWaiting);
  if(cellarWaiting){st.tips.h_cellar=S.day;delete st.flags.cellar1;st.hl="h_cellar"}
  done("h_shop",st.seen["1.3"]);done("t_work",g("c1sell"));done("t_upg",g("c1hag"));done("t_beltgo",g("c1craft"));
  done("h_skills",st.flags.skills);done("t_pay",st.flags.skills);

  done("h_mine",st.flags.mine);done("h_vault",st.flags.vault);done("h_hire",st.built.tavern);done("h_collect",st.built.market);
  done("h_spire",st.seen["5.2"]);done("h_heart",st.seen["6.1"]);done("h_forge",st.seen["6.1"]);done("h_fest",st.built.festival);

/* Saves from before the war-council button and the Spoon Man's visit. */
function migrateTut3(st){
  if(st.flags.tut3)return;st.flags.tut3=S.day;
  if(st.built.market)st.flags.spoonDone=st.flags.spoonDone||S.day; // collectors have already been coming
  if(st.seen["6.1"]){st.tips.t_council=st.tips.t_council||S.day;st.tips.t_forge=st.tips.t_forge||S.day}
  else if(st.ch===6){st.queue=st.queue.filter(x=>x!=="6.1");tip("t_council")} // 6.1 now waits for its button
}
/* Saves that finished the game before Endless Goals: start three tier-1 goals and show Wren's prompt once. */
function migrateTut4(st){
  if(!st.flags.tut4){st.flags.tut4=S.day;if(st.ended){egStart();tip("t_endless")}}
  else if(st.ended&&!st.endless)egStart();
}
function migrateStory(){
  if(!S.crew)S.crew=S.hired?[S.hired]:[];
  delete S.hired;
  if(S.story){
    const st=S.story,d=newStory();for(const k in d)if(st[k]===undefined)st[k]=d[k];
    // Catch up after an update: finished chapters count as complete, and a chapter that ended before its successor existed moves on.
    for(let c=1;c<st.ch;c++)for(const g of chGoals(c))if(!st.goals[g.id])st.goals[g.id]=S.day;
    if(st.ch===1&&st.flags.ch1done)for(const g of chGoals(1))if(!st.goals[g.id])st.goals[g.id]=S.day;
    if(st.flags["ch"+st.ch+"ended"]&&CH[st.ch+1])startChapter(st.ch+1);
    migrateTut2(st);migrateTut3(st);migrateTut4(st);
    return;
  }
  const st=S.story=newStory();
  const started=S.day>1||S.xp>0||S.sold>0;
  if(!started){st.queue.push("1.1");return}
  // An existing shop: Chapter 1 counts as done, and the story picks up with Voss's letter.
  st.flags.migrated=S.day;st.flags.skills=true;st.flags.firstDelve=true;
  for(const g of chGoals(1))st.goals[g.id]=S.day;
  for(const id in SCN)if(id.startsWith("1.")&&id!=="1.7")st.seen[id]=S.day;
  for(const id in TIPS)if(TIPS[id].ch===1)st.tips[id]=S.day;
  st.flags.ch1done=S.day;
  st.queue.push("1.7");
  for(const k of S.crew){st.hiredEver[k]=true;st.flags["met_"+k]=true}
  if(S.crew.includes("pip"))st.flags.pipHired=true;
}

/* ---------- Journal extras: debt, town ---------- */
function journalExtras(){
  const st=S.story;let h="";
  if(st.ch>=2||st.debtPaid){
    const due=payDue(),loanLock=st.loan>0;
    h+=`<section><h2>Ledgers</h2><div class="list">
      <div class="row"><span><b>Maribel's debt</b> <span class="sub">Celestial Consortium</span></span>
        <span class="sub">${st.debtPaid>=DEBT_PAYMENTS?"Paid in full.":`${st.debtPaid} of ${DEBT_PAYMENTS} payments made · balance ${fmt(debtLeft())}G`}</span>
        <span class="right">${st.debtPaid<DEBT_PAYMENTS?`<button class="btn gold sm" data-act="payDebt" ${due&&S.gold>=payAmt()&&!loanLock?"":"disabled"}>Pay ${fmt(payAmt())}G</button>`:"✓"}</span></div>
      ${typeof loanRow==="function"?loanRow():""}
    </div>
    ${st.debtPaid<DEBT_PAYMENTS&&!due?`<p class="hint" style="margin-top:8px">The next payment comes due in Chapter ${st.debtPaid+2}.</p>`:""}
    ${loanLock&&due?`<p class="hint" style="margin-top:8px"><b class="who">Wren</b> “Clear the last loan first. One debt at a time.”</p>`:""}
    </section>`;
  }
  h+=forgeSection();
  const avail=BUILD.filter(b=>st.ch>=b.ch||built(b.k));
  if(avail.length){
    h+=`<section><h2>Hollowmere <small>${custBase()} customers a day</small></h2><div class="list">${avail.map(b=>{
      if(built(b.k))return `<div class="row"><span><b>${b.n}</b> <span class="crown">Repaired</span></span><span class="sub">${b.desc}</span><span class="right">✓</span></div>`;
      const reqOk=!b.req||b.req();
      const parts=[`<span class="${S.gold>=b.gold?"have":"need"}">${fmt(b.gold)}G</span>`,...Object.entries(b.mats).map(([m,n])=>`<span class="${(S.mats[m]||0)>=n?"have":"need"}">${n} ${MATS[m]}</span> (${S.mats[m]||0})`)];
      if(b.item)parts.push(`<span class="${S.story.items[b.item]?"have":"need"}">star-glass</span>`);
      return `<button class="row" data-act="repair" data-k="${b.k}" ${canBuild(b)?"":"disabled"}><span><b>${b.n}</b></span>
        <span class="sub">${reqOk?parts.join(" + "):b.lock}<br>${b.desc}</span><span class="right">Repair</span></button>`}).join("")}</div></section>`;
  }
  if(typeof journalExtras2==="function")h+=journalExtras2();
  return h;
}

/* ---------- Building gates on existing features ---------- */
const APOTH_RECIPES=["bomb","bomb2","bomb3","bomb4","bomb5","rope","tonic","draught","elixir"];
function recipeLock(r){
  if(APOTH_RECIPES.includes(r.out)&&!built("apothecary"))return "Needs the Apothecary";
  if(isBomb(r.out)&&bombRank(r.out)>powder())return `Needs Blasting Powder rank ${bombRank(r.out)} (Upgrades)`;
  if(isWhet(r.out)&&whetRank(r.out)>grind())return `Needs Master Grindstone rank ${whetRank(r.out)} (Upgrades)`;
  if(IT[r.out].t>=3&&!built("smithy"))return "Needs the Smithy";
  return "";
}
const gearCap=k=>["blade","armor","pack"].includes(k)&&!built("smithy")?3:10;
const upLimit=u=>Math.min(u.max||10,gearCap(u.k));
const upLocked=u=>!!(u.need&&!u.need());

/* ---------- Special customer days ---------- */
const collectorDay=()=>built("market")&&S.day%7===3;
const festivalDay=()=>built("festival")&&S.day%7===0;
function dayBonusFn(){return (collectorDay()?2:0)+(festivalDay()?3:0)}
function dayWeight(c){return collectorDay()&&(c.k==="coll"||c.k==="noble")?4:1}
function dayNews(){
  if(festivalDay())return "Festival day! Lanterns on every street: 3 extra customers, and everyone's feeling generous.";
  if(collectorDay())return "Collector day at the Market Square: 2 extra customers, and collectors are out in force.";
  return "";
}

/* ---------- Post-game: Endless Goals ---------- */
/* Three goals at once, one of each type (Delve, Shop, Craft). Each completion pays out, raises the tier by 1 and is
   replaced by a new goal of the same type. Targets grow about 15% per tier. To add a goal, add an entry to EG_POOL:
   k (id), cat (delve|shop|craft), base (tier 1 target), t(n,g) (text), on(event,data,g) (progress to add, or {set:n}),
   optional gold (round targets to 50G), setup(g) (extra state), day (progress counts one day only). Lives in S.story,
   so it carries through every Grand Reopening. */
const EG_CATS=["delve","shop","craft"];
const EG_POOL=[
 {k:"kill",cat:"delve",base:15,t:n=>`Defeat ${n} monsters in any dungeon`,on:e=>e==="kill"?1:0},
 {k:"floor",cat:"delve",base:4,t:(n,g)=>`Reach floor ${n} of the ${DUN[g.d].n}`,
  setup:g=>{const open=DUN.map((_,i)=>i).filter(i=>DUN_GATE[i]&&DUN_GATE[i]()),o=open.length?open:[0];g.d=o[Math.floor(Math.random()*o.length)];g.n=Math.min(g.n,DUN[g.d].floors)},
  on:(e,d,g)=>e==="floor"&&d.d===g.d?{set:d.floor}:0},
 {k:"boss",cat:"delve",base:1,t:n=>n===1?"Defeat any boss (Echo of Voss counts)":`Defeat ${n} bosses (Echo of Voss counts)`,on:(e,d)=>e==="defeat"&&d.kind==="boss"?1:0},
 {k:"stair",cat:"delve",base:1,t:n=>n===1?"Find a hidden stairway":`Find ${n} hidden stairways`,on:e=>e==="secretStair"?1:0},
 {k:"sell",cat:"shop",base:10,t:n=>`Sell ${n} items`,on:(e,d)=>e==="sale"?1:e==="sold"?d.n:0},
 {k:"haggle",cat:"shop",base:5,t:n=>`Haggle ${n} sales above market value`,on:(e,d)=>e==="sale"&&d.above&&d.haggled?1:0},
 {k:"earn",cat:"shop",base:2000,gold:true,day:true,t:n=>`Earn ${fmt(n)}G from sales in one day`,on:(e,d)=>e==="sale"?d.price:e==="sold"?d.g:0},
 {k:"coll",cat:"shop",base:3,t:n=>`Sell to ${n} collectors (the Spoon Man counts double)`,on:(e,d)=>e==="sale"&&d.type==="coll"?(d.reg==="the Spoon Man"?2:1):0},
 {k:"craft",cat:"craft",base:5,t:n=>`Craft ${n} items in the Workshop`,on:(e,d)=>e==="craft"?d.n:0},
 {k:"kit",cat:"craft",base:3,t:n=>`Craft ${n} bombs or whetstones`,on:(e,d)=>e==="craft"&&(isBomb(d.k)||isWhet(d.k))?d.n:0}
];
const EGP=k=>EG_POOL.find(x=>x.k===k);
const EG_BUNDLE={ember:2,ore:2,dust:1};
const egTarget=(def,tier)=>{const v=def.base*Math.pow(1.15,tier-1);return Math.max(1,def.gold?Math.round(v/50)*50:Math.round(v))};
const egReward=tier=>1000+250*(tier-1);
function egMake(k,tier){const def=EGP(k),g={k,tier,n:egTarget(def,tier),p:0};if(def.setup)def.setup(g);if(def.day)g.day=S.day;return g}
function egNew(cat,tier,avoid){const c=EG_POOL.filter(x=>x.cat===cat),o0=c.filter(x=>x.k!==avoid),o=o0.length?o0:c;return egMake(o[Math.floor(Math.random()*o.length)].k,tier)}
function egStart(){const st=S.story;if(st.endless)return;st.endless={tier:1,done:0,goals:EG_CATS.map(c=>egNew(c,1))}}
const egProg=g=>EGP(g.k).day&&g.day!==S.day?0:g.p;
function egEvent(type,d){
  const E=S.story.endless;if(!E)return;let hit=false;const msgs=[];
  for(const g of E.goals){
    const def=EGP(g.k);if(!def)continue;const r=def.on(type,d||{},g);if(!r)continue;
    if(def.day&&g.day!==S.day){g.day=S.day;g.p=0}
    if(typeof r==="object")g.p=Math.max(g.p,r.set);else g.p+=r;hit=true;
  }
  if(!hit)return;
  E.goals.forEach((g,i)=>{if(egProg(g)<g.n)return;
    E.done++;E.tier++;const gold=egReward(g.tier);S.gold+=gold;const parts=[`${fmt(gold)}G`];
    if(E.done%5===0){for(const [m,n] of Object.entries(EG_BUNDLE))S.mats[m]=(S.mats[m]||0)+n;parts.push(Object.entries(EG_BUNDLE).map(([m,n])=>`${n} ${MATS[m]}`).join(", "))}
    if(E.done%10===0){S.legacy.stars++;S.legacy.total++;parts.push("1 Reputation star")}
    msgs.push(`<b>Goal complete!</b> +${parts.join(" + ")}`);E.last=msgs.at(-1);
    E.goals[i]=egNew(EGP(g.k).cat,E.tier,g.k);
  });
  if(msgs.length){sfx.win();const m=msgs.join("<br>"),t=document.getElementById("toast");
    if(t&&t.classList.contains("show"))setTimeout(()=>toast(m),1400);else toast(m)}
  save();
}
TIPS.t_endless={w:"Wren",t:"Story's done. The shop isn't. There's always more to do. Check the **Journal**.",hl:{sel:"#endless",tab:"journal",town:true}};
function endlessCard(){
  const E=S.story.endless;
  const rows=E.goals.map(g=>{const p=Math.min(egProg(g),g.n),def=EGP(g.k);
    return `<li class="eg"><span><span><b>${def.t(g.n,g)}</b> · <span class="egp">${def.gold?`${fmt(p)}G / ${fmt(g.n)}G`:`${fmt(p)} / ${fmt(g.n)}`}</span></span><span class="right coin">+${fmt(egReward(g.tier))}G</span></span>
      <div class="bar" role="progressbar" aria-label="${def.t(g.n,g)}" aria-valuemin="0" aria-valuemax="${g.n}" aria-valuenow="${p}"><i style="width:${Math.round(p/g.n*100)}%"></i></div></li>`}).join("");
  return `<div class="card jcard" id="endless"><h2 class="jtitle">Storyline Complete!</h2><span class="sub">Goals completed: ${fmt(E.done)}</span>
    <ul class="goals egs">${rows}</ul><p class="hint">Every 5th goal also brings ${Object.entries(EG_BUNDLE).map(([m,n])=>`${n} ${MATS[m]}`).join(", ")}. Every 10th brings a Reputation star.</p></div>`;
}

const VOSS_PHASE={1:"The Guildmaster",2:"The Unmasking",3:"The Fallen Star"};
/* Called after the player damages Voss: moves to Phase 2 at 66% HP and Phase 3 at 33%. */
function vossPhaseCheck(){
  const F=S.run&&S.run.fight;if(!F||F.kind!=="voss"||F.hp<=0)return;
  const pct=F.hp/F.max;
  if(F.phase<2&&pct<=.66){F.phase=2;F.p2t=0;F.wind=false;SE("vossPhase",{p:2,n:F.n})}
  if(F.phase<3&&pct<=.33){F.phase=3;F.p3t=0;F.wind=false;SE("vossPhase",{p:3,n:F.n})}
}
function vossTurn(guard){
  const R=S.run,F=R.fight;F.turn++;
  const hitFor=mult=>{const t=Math.max(1,Math.round(F.atk*rnd(.85,1.15)*mult*(guard?.3:1)));R.hp-=t;return t};
  let m="";
  if(F.phase===1){
    if(F.wind){F.wind=false;m=`Voss hurls a storm of gold coins for ${hitFor(2)}!`}
    else{m=`Voss's coins cut you for ${hitFor(1)}.`;
      if(F.turn%3===0)m+=` A Celestial enforcer joins in for ${hitFor(.5)}.`;
      if(F.turn%3===2){F.wind=true;m+=" He gathers a fistful of gold. Heavy attack incoming!"}}
  }else if(F.phase===2){
    m=`Voss strikes for ${hitFor(1.1)}.`;
    const h=Math.max(0,Math.round(F.max*(.07-.015*F.p2t)));F.p2t++;
    if(h>0){const before=F.hp;F.hp=Math.min(Math.round(F.max*.66),F.hp+h);m+=` He draws on the heart and heals ${F.hp-before}. Sable pulls at the thread; the link weakens.`}
    else m+=" Sable has torn the thread loose. He can't heal anymore.";
  }else{
    m=`Voss burns you for ${hitFor(1.2)}.`;
    if(F.star){F.star=false;const t=Math.max(1,Math.round(maxHp()*(guard?.04:.15)));R.hp-=t;m+=` Starfire crashes down for ${t}${guard?" (you guard against the worst of it)":""}!`}
    F.p3t++;
    if(F.p3t%2===1){const t=Math.max(1,Math.round(maxHp()*.06));R.hp-=t;m+=` Magma vents erupt beneath you for ${t}.`}
    else{F.star=true;m+=" Starfire gathers overhead. Guard!"}
  }
  guard?sfx.guard():sfx.hurt();SE("hit");
  return m;
}

const mf=m=>440*Math.pow(2,(m-69)/12);
const ct=(ch,i)=>ch[i%3]+12*Math.floor(i/3);
function setupMusic(){
  if(M.gain)return;
  const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
  M.gain=ac.createGain();M.gain.gain.value=.7;M.gain.connect(comp);
  const len=Math.floor(ac.sampleRate*2.8),buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}
  const conv=ac.createConvolver();conv.buffer=buf;
  M.rv=ac.createGain();M.rv.gain.value=.4;M.rv.connect(conv);conv.connect(comp);
  const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;M.noise=nb;
}
function send(node,wet){node.connect(M.gain);if(wet)node.connect(M.rv)}
function env(t,a,d,v){const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);return g}
function osc(type,f,t,stop,dest,det){const o=ac.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.connect(dest);o.start(t);o.stop(stop);return o}
function pluck(f,t,v){
  const g=env(t,.004,1.4,v),fl=ac.createBiquadFilter();fl.type="lowpass";
  fl.frequency.setValueAtTime(Math.min(8000,f*6),t);fl.frequency.exponentialRampToValueAtTime(Math.max(300,f*1.4),t+.5);
  osc("triangle",f,t,t+1.5,fl);const hg=ac.createGain();hg.gain.value=.25;hg.connect(fl);osc("sine",f*2,t,t+1.5,hg);
  fl.connect(g);send(g,true);
}
function pad(f,t,d,v,cut){
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.35);g.gain.linearRampToValueAtTime(.0001,t+d+.4);
  const fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=cut;fl.Q.value=.3;
  osc("sawtooth",f,t,t+d+.5,fl,-7);osc("sawtooth",f,t,t+d+.5,fl,7);fl.connect(g);send(g,true);
}
function strings(f,t,d,v,cut){
  const g=env(t,.03,d,v),fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=cut;
  osc("sawtooth",f,t,t+d+.1,fl,-5);osc("sawtooth",f,t,t+d+.1,fl,5);fl.connect(g);send(g,true);
}
function flute(f,t,d,v){
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.09);g.gain.setValueAtTime(v,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  const o=osc("sine",f,t,t+d+.05,g);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.007,t+.35);
  lfo.connect(lg).connect(o.frequency);lfo.start(t);lfo.stop(t+d+.05);
  const og=ac.createGain();og.gain.value=.07;og.connect(g);osc("triangle",f*2,t,t+d+.05,og);
  send(g,true);
}
function bassN(f,t,d,v){const g=env(t,.02,d,v),fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=380;osc("triangle",f,t,t+d+.1,fl);fl.connect(g);send(g,false)}
function drum(t,v,low){
  const s=ac.createBufferSource();s.buffer=M.noise;const fl=ac.createBiquadFilter();
  fl.type=low?"lowpass":"highpass";fl.frequency.value=low?180:6500;
  const g=env(t,.002,low?.3:.05,low?v*.5:v);s.connect(fl).connect(g);send(g,low);s.start(t);s.stop(t+.4);
  if(low){const o=ac.createOscillator(),og=env(t,.003,.3,v);o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(52,t+.25);o.connect(og);send(og,true);o.start(t);o.stop(t+.4)}
}
function playStep(T,step,t,sp){
  const s=step%8,ch=T.chords[Math.floor(step/8)%4],R=T.root;
  if(s===0)ch.forEach(n=>pad(mf(R+n),t,sp*8,T.padV,T.padCut));
  const a=T.arp?T.arp[s]:null;if(a!=null)pluck(mf(R+T.arpOct+ct(ch,a)),t,T.arpV);
  const b=T.bass[s];if(b!=null)bassN(mf(R-12+(b?ch[2]:ch[0])),t,sp*T.bassLen,.16);
  if(T.ost)strings(mf(R+(s%2?ch[0]+12:ch[0])),t,sp*.9,.03,1500);
  if(T.low.includes(s))drum(t,T.lowV||.22,true);
  if(T.hat.includes(s))drum(t,.035,false);
  const m=T.mel;
  if(s%m.every===0&&Math.random()<m.dens){
    M.walk=Math.max(0,Math.min(m.top??9,M.walk+pick([-2,-1,-1,0,1,1,2])));
    const n=R+m.oct+T.scale[M.walk%5]+12*Math.floor(M.walk/5),d=sp*m.len;
    if(m.inst==="pluck")pluck(mf(n),t,m.v);else if(m.inst==="strings")strings(mf(n),t,d,m.v,2200);else flute(mf(n),t,d,m.v);
  }
}
function schedule(){
  const T=TRACKS[M.track];if(!T||!ac)return;const sp=60/T.bpm/2;
  if(M.next<ac.currentTime)M.next=ac.currentTime+.05;
  while(M.next<ac.currentTime+.25){playStep(T,M.step,M.next,sp);M.next+=sp;M.step=(M.step+1)%32}
}
function musicUpdate(){
  if(!S.music){if(M.timer){clearInterval(M.timer);M.timer=null;M.track=null}return}
  if(!ac)return;
  setupMusic();
  const want=S.run?.fight?.boss?"boss":S.run?"dungeon":S.shop?"shop":"town";
  if(M.track!==want){M.track=want;M.step=0;M.walk=4;M.next=ac.currentTime+.08}
  if(!M.timer)M.timer=setInterval(schedule,50);
}

/* ================= Shop staff ================= */
const STAFF=[
 {k:"pip",n:"Pip",title:"Nervous apprentice",wage:15,sells:2,rate:.8,need:()=>fl("met_pip"),lock:"You'll meet him in Chapter 2.",bio:"Cheap and eager, but undersells everything."},
 {k:"marlo",n:"Marlo",title:()=>seen("4.4")?"Smooth talker · ex-Celestial":"Smooth talker",wage:45,sells:3,rate:.95,need:()=>fl("met_marlo"),lock:"Repair the Tavern to meet them.",bio:"Knows how to chat up a customer."},
 {k:"greta",n:"Old Greta",title:"Shrewd veteran",wage:140,sells:4,rate:1.08,need:()=>fl("met_greta"),lock:"Defeat the Kobold Foreman, with the Tavern repaired.",bio:"Ran the general store before your aunt was born. Nobody fools her."},
 {k:"sable",n:"Sable",title:"Silver-tongued dealer",wage:420,sells:5,rate:1.2,need:()=>fl("met_sable"),lock:"Defeat the Cinder Colossus.",bio:"Can sell anything to anyone. Would rather not say where she learned."}
];
const ST=k=>STAFF.find(x=>x.k===k);
const staffRec=k=>(S.staffs[k]=S.staffs[k]||{sold:0,wageB:0,rateB:0});
/* Staff levels 1-100. Levels 2-5 take 12 sales each, as before. From level 5 on, each level takes 2.5% more sales
   than the last (12 at level 5, about 36 at level 50, about 120 at level 99): roughly 1,000 lifetime sales for level 50
   and 4,600 for level 100. STAFF_AT[L] is the lifetime sales needed to reach level L. */
const STAFF_MAX=100;
const STAFF_AT=(()=>{const a=[0,0];for(let L=2;L<=STAFF_MAX;L++)a[L]=a[L-1]+(L<=5?12:Math.round(12*Math.pow(1.025,L-6)));return a})();
const staffLvlAt=sold=>{let L=1;while(L<STAFF_MAX&&sold>=STAFF_AT[L+1])L++;return L};
const staffLvl=k=>staffLvlAt(staffRec(k).sold);
const staffNext=k=>staffLvl(k)>=STAFF_MAX?null:STAFF_AT[staffLvl(k)+1];
const staffLvlPart=k=>{const L=staffLvl(k);return L>=STAFF_MAX?null:{done:staffRec(k).sold-STAFF_AT[L],need:STAFF_AT[L+1]-STAFF_AT[L]}};
// Prices: +3% a level up to 5, then +0.5% a level (a level 100 Sable asks about 180% of market).
const staffLvlRate=L=>.03*(Math.min(L,5)-1)+.005*Math.max(0,L-5);
const staffRate=k=>ST(k).rate+staffLvlRate(staffLvl(k))+staffRec(k).rateB+.05*sk("boss2");
// Daily sales: +1 at levels 3 and 5 as before, then +1 at every tenth level (10, 20 ... 100).
const staffSells=k=>{const L=staffLvl(k);return ST(k).sells+Math.floor((Math.min(L,5)-1)/2)+Math.floor(L/10)};
const staffWage=k=>Math.round(ST(k).wage*(1+staffRec(k).wageB));
const staffWageMult=n=>Math.pow(1.5,Math.max(0,n-1));
const staffPayroll=(crew=S.crew)=>Math.round(crew.reduce((a,k)=>a+staffWage(k),0)*staffWageMult(crew.length));
const staffMultText=n=>(Math.round(staffWageMult(n)*100)/100)+"×";
/* Keep tags: items that go on the supply belt (potions and supplies) default to Keep; anything else defaults to For sale.
   S.keep[k] stores the player's own choice (true = Keep, false = For sale) and overrides the default. */
const keepsByDefault=k=>!!HEAL[k]||IT[k].c==="supply";
const isKept=k=>S.keep[k]!==undefined?!!S.keep[k]:keepsByDefault(k);
const forSale=()=>S.inv.filter(k=>!isKept(k));
const THIEF_TARGETS=["pip","marlo"];
const catchChance=k=>{const L=staffLvl(k);return Math.min(.9,.1+.15*(Math.min(L,5)-1)+.002*Math.max(0,L-5))};
const custW=c=>c.w*(typeof dayWeight==="function"?dayWeight(c):1);
function pickCust(){
  const pool=CUST.filter(c=>c.need());
  let w=Math.random()*pool.reduce((a,c)=>a+custW(c),0);
  for(const c of pool){w-=custW(c);if(w<=0)return c}
  return pool[pool.length-1];
}
function hire(k,quiet){const s=ST(k);if(!s||!s.need()||S.crew.includes(k))return;S.crew.push(k);S.story.hiredEver[k]=true;confirmFire=null;
  if(!quiet){sfx.coin();toast(`<b>${s.n}</b> joins your staff and will mind the shop on days you go delving.`)}SE("hire",{k});save();render()}
let confirmFire=null;
function fire(k){const s=ST(k);S.crew=S.crew.filter(x=>x!==k);confirmFire=null;toast(`${s?s.n:"Your shopkeeper"} heads back to the Tavern hire board.`);save();render()}
const nameList=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1];
/* Runs when you head into a dungeon. Staff aren't bound by the shop's customers a day: each shopkeeper serves their own
   customers, up to their daily sales limit, with room for 2 who balk or find nothing they want. Settled now, reported on return. */
/* Who makes a sale: later hires start with more pull (Pip 1, Marlo 2, Greta 3, Sable 4, so 10/20/30/40% at equal levels),
   and each level above 1 adds 1. A level 5 Pip (5) outsells a level 1 Sable (4). */
const staffWeight=k=>{const L=staffLvl(k);return STAFF.findIndex(s=>s.k===k)+1+(Math.min(L,5)-1)+.1*Math.max(0,L-5)};
/* Better sellers talk customers into more: their higher prices put fewer people off. */
// Past level 5 their budget stretch keeps pace with their higher prices, so customers don't start walking away.
const staffSway=k=>{const L=staffLvl(k),base=ST(k).rate+staffLvlRate(Math.min(L,5));
  return (1+.06*STAFF.findIndex(s=>s.k===k)+.03*(Math.min(L,5)-1))*(base+staffLvlRate(L)-staffLvlRate(Math.min(L,5)))/base};
function pickStaff(list){let r=Math.random()*list.reduce((a,st)=>a+staffWeight(st.k),0);for(const st of list){r-=staffWeight(st.k);if(r<0)return st}return list[list.length-1]}
function staffShift(){
  const crew=S.crew.map(ST).filter(Boolean);if(!crew.length)return null;
  const who=nameList(crew.map(c=>c.n)),wage=staffPayroll(crew.map(c=>c.k));
  if(!forSale().length)return {who,lines:[`Nothing was marked For sale, so ${who} took the day off.`],gold:0,wage:0};
  if(S.gold<wage)return {who,lines:[`You couldn't cover ${fmt(wage)}G in wages, so the shop stayed closed.`],gold:0,wage:0};
  const lines=[];let gold=0,raise=null;
  const evSt=pick(crew);
  let ev=Math.random()<.35?pick(["great","swindle","trade","tip","raise",...(THIEF_TARGETS.includes(evSt.k)?["thief"]:[])]):null;
  const take=key=>S.inv.splice(S.inv.indexOf(key),1);
  // Each sale goes to a staff member picked at random, weighted toward later, more skilled hires and higher levels,
  // from those who haven't reached their daily limit.
  const sold={},L0={},served={};for(const st of crew){sold[st.k]=0;served[st.k]=0;L0[st.k]=staffLvl(st.k)}
  const free=()=>crew.filter(st=>sold[st.k]<staffSells(st.k)&&served[st.k]<staffSells(st.k)+2);
  while(forSale().length&&free().length){
    const st=pickStaff(free()),rate=staffRate(st.k);served[st.k]++;
    const C=pickCust(),m=forSale().filter(x=>!C.cats||C.cats.includes(IT[x].c));
    if(!m.length)continue;
    const key=pick(m),v=val(key);let price=Math.max(1,Math.round(v*rate*rnd(.95,1.05)));
    const max=Math.round(v*rnd(...C.bud)*signB()*staffSway(st.k));
    if(price>max){lines.push(`A ${C.n.toLowerCase()} balked at ${st.n}'s price for the ${IT[key].n}.`);continue}
    const mine=st===evSt;
    if(mine&&ev==="trade"){
      const pool=[...new Set(DUN.filter((d,i)=>dunOpen(i)).flatMap(d=>d.mats))],mt=pick(pool);
      take(key);addMat(mt,2);sold[st.k]++;ev=null;lines.push(`A traveler traded ${st.n} 2 ${MATS[mt]} for ${an(IT[key].n)}.`);continue;
    }
    let note="";
    if(mine&&ev==="great"){price=Math.round(price*1.4);note=` ${st.n} charmed them into paying 40% extra!`;ev=null}
    else if(mine&&ev==="swindle"){price=Math.max(1,Math.round(price*.5));note=` A fast talker haggled ${st.n} down to half price.`;ev=null}
    take(key);gold+=price;sold[st.k]++;lines.push(`${st.n} sold ${an(IT[key].n)} for ${fmt(price)}G.${note}`);
  }
  for(const st of crew){
    const rec=staffRec(st.k);rec.sold+=sold[st.k];S.sold+=sold[st.k];
    const L1=staffLvl(st.k);if(L1>L0[st.k])lines.push(`${st.n} reached level ${L1}! Better prices from now on.`);
  }
  if(ev==="thief"){const p=forSale();if(p.length){
    const key=pick(p);lines.push(`While ${evSt.n} was distracted, a thief made off with ${an(IT[key].n)}!`);
    if(Math.random()<catchChance(evSt.k))lines.push(`${evSt.n} gave chase and caught them, recovering the ${IT[key].n}.`);
    else{take(key);lines.push(`${evSt.n} gave chase, but the thief got away.`)}
  }}
  if(ev==="tip"&&gold){const t=Math.round(rnd(.05,.12)*gold)+5;gold+=t;lines.push(`A regular customer left ${evSt.n} a ${t}G tip.`)}
  if(ev==="raise")raise=evSt.k;
  if(!lines.length)lines.push(`No customers wanted anything on the shelves today.`);
  return {who,lines,gold,wage,raise,n:Object.values(sold).reduce((a,b)=>a+b,0)};
}
function settleShift(){
  const R=S.run;if(!R||!R.shift)return;const r=R.shift;
  S.gold=Math.max(0,S.gold+r.gold-r.wage);S.earned+=r.gold;
  S.report=r;if(r.n)SE("sold",{n:r.n,g:r.gold});
}

function explore(){
  const R=S.run,D=DUN[R.d],f=tfOf(D);R.steps++;R.left=null;R.dropSel=null;sfx.step();
  const last=R.floor===D.floors,mod=R.mod;
  if(!R.secretFloor&&!last&&!R.stairs&&R.steps>=2&&Math.random()<(mod==="dark"?.1:.22)){R.stairs=true;R.nextMod=rollMod(R.floor+1);R.event="You spot a staircase leading down.";rlog(R.event);SE("stairs",{d:R.d,floor:R.floor});return save(),render()}
  if(last&&!R.lair&&!R.bossDone&&R.steps>=2&&Math.random()<.25){R.lair=true;R.event=`Heavy footsteps echo ahead. The lair of the ${D.boss} is close.`;sfx.boss();rlog(R.event);return save(),render()}
  if(R.floor===Math.ceil(D.floors/2)&&!R.miniDone&&R.steps>=2&&Math.random()<.3){
    R.ev={type:"mini"};R.event=`A massive shape blocks the corridor: the ${MINI[R.d]}, guardian of this depth.`;sfx.boss();rlog(R.event);return save(),render()}
  if(Math.random()<(mod==="blessed"?.2:.13)+(mod==="vault"?.15:0)){startEvent();return save(),render()}
  const r=Math.random();let c=.36+.04*sk("keen")+(R.secretFloor?.15:0);
  if(r<c){
    const k=R.secretFloor&&Math.random()<.3?secretItem():rollItem();
    if(bagAdd(k)){R.event=`You find ${an(IT[k].n)}! (worth about ${val(k)}G)`;sfx.loot();SE("loot")}else R.event=`You find ${an(IT[k].n)}, but your pack is full.`;
  }
  else if(r<(c+=mod==="dark"?.16:.08)){const g=dropMats(mod==="dark"?ri(2,3):ri(1,2));R.event=`You pry loose ${g.join(" and ")} from the walls.`;sfx.loot()}
  else if(r<(c+=.30+(mod==="haunted"?.2:0)+R.floor*.01)){makeFight(pick(D.mon),"mob");R.event=`A ${R.fight.n} blocks your path!`}
  else if(r<(c+=mod==="flooded"?.18:.09)){const d=hurtPct(.12);R.event=mod==="flooded"?`You slip into a flooded pit! You lose ${d} HP.`:`A trap springs! You lose ${d} HP.`;sfx.hurt()}
  else if(r<(c+=mod==="blessed"?.12:.07)){const h=Math.round(maxHp()*.3);R.hp=Math.min(maxHp(),R.hp+h);R.event=`A clear spring restores ${h} HP.`}
  else{const g=Math.round(rnd(4,12)*f*R.floor);S.gold+=g;R.event=`You find a dropped purse with ${g}G.`;sfx.coin()}
  rlog(R.event);flavorLine();
  if(R.hp<=0)return faint();
  save();render();
}

/* ---------- Room events ---------- */
function merchantOffers(){
  const D=DUN[S.run.d],pot=["herb","tonic","draught","elixir"][D.t-1],sup=pick(["bomb","rope","whet","pick"]);
  return [{k:pot,p:Math.round(IT[pot].b*1.4)},{k:sup,p:Math.round(IT[sup].b*1.6)}];
}
function startEvent(){
  const R=S.run,D=DUN[R.d];
  const types=["chest","merchant","shrine","sleeper","fountain"];
  if(R.floor>=2&&!R.elite&&!R.secretFloor)types.push("elite","elite");
  const t=R.mod==="vault"&&Math.random()<.6?"chest":pick(types);
  R.ev={type:t};
  if(t==="chest")R.event="A locked iron chest sits in an alcove.";
  if(t==="merchant"){R.ev.offers=merchantOffers();R.event="A hooded peddler waves you over. “Supplies, friend? Fair prices, this deep.”"}
  if(t==="shrine")R.event="A cracked shrine hums with old power. It asks for blood.";
  if(t==="sleeper"){R.ev.mon=pick(D.mon);R.event=`A ${R.ev.mon} is asleep across the passage.`}
  if(t==="fountain")R.event="A glowing fountain bubbles in the dark. The water smells strange.";
  if(t==="elite"){R.ev.mon=pick(D.mon);R.elite=true;R.event=`A sealed door glows with runes. Behind it, an elite ${R.ev.mon} guards a treasure.`}
  rlog(R.event);SE("roomEvent",{t});
}
const sneakCh=()=>Math.min(.95,.65+.1*sk("escape"));
function openChest(pre){
  const R=S.run,D=DUN[R.d];
  const k=R.secretFloor&&Math.random()<.5?secretItem():rollItem(Math.random()<.5);
  const g=Math.round(rnd(10,25)*tfOf(D)*R.floor);S.gold+=g;
  R.ev=null;R.event=`${pre} Inside: ${g}G`+(bagAdd(k)?` and ${an(IT[k].n)}!`:`, and ${an(IT[k].n)} you have no room for.`);sfx.loot();
}
function giveSupply(k){
  if(S.belt.length<beltCap()){S.belt.push(k);return "on your belt"}
  if(bagAdd(k))return "in your pack";
  return null;
}
function evChoice(c){
  const R=S.run,E=R.ev;if(!E)return;
  if(c==="leave"){R.ev=null;R.event=E.type==="mini"?`You back away from the ${MINI[R.d]}. It may still find you.`:"You leave it be and press on."}
  else if(E.type==="chest"){
    if(c==="pick"&&S.belt.includes("pick")){S.belt.splice(S.belt.indexOf("pick"),1);openChest("Your lockpick clicks the lock open.")}
    else if(c==="force"){if(Math.random()<.55)openChest("You pry the lid open.");else{const d=hurtPct(.15);R.ev=null;R.event=`A needle trap jabs you for ${d}. The chest jams shut.`;sfx.hurt()}}
  }
  else if(E.type==="merchant"&&c.startsWith("buy")){
    const o=E.offers[+c.slice(3)];
    if(o&&!o.sold&&S.gold>=o.p){const where=giveSupply(o.k);
      if(where){S.gold-=o.p;o.sold=true;R.event=`You buy ${an(IT[o.k].n)}. It's ${where}.`;sfx.coin()}else R.event="You have no room to carry that."}
    if(E.offers.every(o=>o.sold)){R.ev=null;R.event+=" The peddler packs up and vanishes."}
  }
  else if(E.type==="shrine"&&c==="offer"){
    const d=Math.min(R.hp-1,Math.round(maxHp()*.2));R.hp-=d;R.atkB+=.25;R.ev=null;
    R.event=`You offer ${d} HP. Power surges through your blade: +25% attack for this delve.`;sfx.lvl();
  }
  else if(E.type==="fountain"&&c==="drink"){
    const r=Math.random();R.ev=null;
    if(r<.4){R.hp=maxHp();R.event="The water is pure. You're fully healed!";sfx.guard()}
    else if(r<.7){R.atkB+=.15;R.event="The water burns pleasantly. +15% attack for this delve.";sfx.lvl()}
    else{const d=hurtPct(.2);R.event=`The water is foul! You lose ${d} HP.`;sfx.hurt()}
  }
  else if(E.type==="sleeper"){
    R.ev=null;
    if(c==="sneak"){
      if(Math.random()<sneakCh())R.event=`You tiptoe past the ${E.mon}. It never stirs.`;
      else{makeFight(E.mon,"mob");R.event=`A loose stone clatters and the ${E.mon} wakes! `+monsterTurn(false)}
    }else if(c==="ambush"){
      makeFight(E.mon,"mob");const d=runDmg()*3;R.fight.hp-=d;sfx.hit();
      if(R.fight.hp<=0)return winFight(`Your ambush deals ${d} and finishes it instantly. `);
      R.event=`Your ambush deals ${d} damage! The ${E.mon} scrambles up to fight.`;
    }
  }
  else if(E.type==="elite"&&c==="fight"){R.ev=null;makeFight("Elite "+E.mon,"elite");R.event=`The door grinds open. The elite ${E.mon} charges!`;sfx.boss()}
  else if(E.type==="mini"&&c==="fight"){R.ev=null;makeFight(MINI[R.d],"mini");R.event=`The ${MINI[R.d]} roars and attacks!`;sfx.boss();rlog(R.event);SE("encounter",{n:MINI[R.d],d:R.d});return save(),render()}
  rlog(R.event);
  if(R.hp<=0)return faint();
  save();render();
}

/* ---------- Combat ---------- */
function challengeBoss(){
  const R=S.run,D=DUN[R.d];
  makeFight(D.boss,R.d===4?"voss":"boss");R.lair=false;R.event=`The ${D.boss} rises to face you!`;sfx.boss();rlog(R.event);save();render();SE("encounter",{n:D.boss,d:R.d});
}
function monsterTurn(guard){
  if(S.run.fight.kind==="voss")return vossTurn(guard);
  const R=S.run,F=R.fight;F.turn++;
  const heavy=F.boss&&F.wind;if(heavy)F.wind=false;
  const t=Math.max(1,Math.round(F.atk*rnd(.8,1.2)*(heavy?2:1)*(guard?.3:1)));
  R.hp-=t;guard?sfx.guard():sfx.hurt();
  let m=heavy?`The ${F.n} unleashes a crushing blow for ${t}!`:`The ${F.n} hits you for ${t}.`;
  if(F.boss&&!heavy&&F.turn%3===2){F.wind=true;m+=` It's winding up a heavy attack!`}
  SE("hit");
  return m;
}
function attack(){
  const R=S.run,F=R.fight;
  let d=Math.round(runDmg()*rnd(.8,1.2));const c=Math.random()<crit();if(c)d*=2;
  F.hp-=d;sfx.hit();
  if(F.hp<=0)return winFight(c?"Critical hit! ":"");
  R.event=`${c?"Critical hit! ":""}You deal ${d}. `+monsterTurn(false);
  vossPhaseCheck();
  if(R.hp<=0)return faint();
  save();render();
}
function guard(){
  const R=S.run;R.event="You raise your guard. "+monsterTurn(true);
  if(R.hp<=0)return faint();save();render();
}
function winFight(pre){const k=S.run.fight.kind||"mob";({mob:mobWin,elite:eliteWin,mini:miniWin,boss:bossWin,voss:bossWin})[k](pre||"");SE("kill",{kind:k})}
function mobWin(pre){
  const R=S.run,F=R.fight,D=DUN[R.d],f=tfOf(D);
  const g=Math.round(rnd(2,6)*f*R.floor),x=xpm(5*D.t*R.floor);
  S.gold+=g;R.fight=null;R.event=`${pre}You defeat the ${F.n}! +${g}G.`;
  if(Math.random()<.7){let n=1;if(Math.random()<.5*sk("salvage"))n++;R.event+=` Got ${dropMats(n).join(", ")}.`}
  if(Math.random()<.4){const k=rollItem();if(bagAdd(k)){R.event+=` It dropped ${an(IT[k].n)}.`;sfx.loot()}}
  R.event+=` +${x} XP.`;rlog(R.event);addXp(x);save();render();
}
function eliteWin(pre){
  const R=S.run,F=R.fight,D=DUN[R.d],f=tfOf(D);
  const g=Math.round(rnd(8,16)*f*R.floor),x=xpm(15*D.t*R.floor),k=rollItem(true);
  S.gold+=g;R.fight=null;
  R.event=`${pre}The ${F.n} falls! +${g}G, ${dropMats(3).join(", ")}`+(bagAdd(k)?`, and its treasure: ${an(IT[k].n)}!`:`. Its treasure, ${an(IT[k].n)}, won't fit in your pack.`);
  R.event+=` +${x} XP.`;sfx.win();rlog(R.event);addXp(x);save();render();
}
function miniWin(pre){
  const R=S.run,D=DUN[R.d],f=tfOf(D);
  const g=Math.round(rnd(20,40)*f*D.t),k=rollItem(true),sup=pick(["bomb","rope","whet","pick"]);
  S.gold+=g;R.fight=null;R.miniDone=true;SE("defeat",{n:MINI[R.d],kind:"mini",d:R.d});
  const where=giveSupply(sup);
  R.event=`${pre}The ${MINI[R.d]} collapses! +${g}G, ${dropMats(2).join(", ")}`+(bagAdd(k)?`, ${an(IT[k].n)}`:"")+(where?`, and ${an(IT[sup].n)} (${where}).`:".");
  {const x=xpm(25*D.t);R.event+=` +${x} XP.`;sfx.win();rlog(R.event);addXp(x)}save();render();
}
function bossWin(pre){
  const R=S.run,D=DUN[R.d],f=tfOf(D);
  const first=!S.bosses[R.d];S.bosses[R.d]=(S.bosses[R.d]||0)+1;
  const g=Math.round(rnd(40,80)*f*D.t),x=xpm(40*D.t);
  S.gold+=g;addMat(D.heart,1);R.got[D.heart]=(R.got[D.heart]||0)+1;
  const k=rollItem(true);const fit=bagAdd(k);
  R.fight=null;R.bossDone=true;SE("defeat",{n:D.boss,kind:"boss",d:R.d});
  R.event=`${pre}The ${D.boss} falls! +${g}G, ${MATS[D.heart]}${fit?`, and ${an(IT[k].n)}`:""}.`+(first?" First victory: +1 skill point!":"");
  if(Math.random()<.35+.05*sk("keen")+secretBonus()){R.secret=true;R.event+=" Behind the lair, a hidden stairway grinds open...";SE("secretStair")}
  R.event+=` +${x} XP.`;rlog(R.event);sfx.win();addXp(x);
  if(first)toast(`<b>${D.boss}</b> defeated! +1 skill point.`);
  save();render();
}
function flee(){
  const R=S.run,F=R.fight;
  if(Math.random()<fleeCh()){R.event=`You slip away from the ${F.n}.`;if(F.kind==="boss"||F.kind==="voss")R.lair=true;R.fight=null}
  else{R.event=`You couldn't escape! `+monsterTurn(false);if(R.hp<=0)return faint()}
  rlog(R.event);save();render();
}

/* ---------- Consumables ---------- */
function canUse(k){
  const R=S.run;if(!R||R.ev)return false;
  if(HEAL[k])return R.hp<maxHp();
  if(isBomb(k)||k==="rope")return !!R.fight;
  if(k==="ladder")return !R.fight&&!R.secretFloor&&R.floor<DUN[R.d].floors&&!floorSealed(R.d,R.floor+1);
  return isWhet(k)&&!R.whetUsed; // one whetstone of any kind per delve
}
function useItem(src,i){
  const R=S.run,F=R.fight,arr=src==="belt"?S.belt:R.bag,k=arr[i];
  if(!k||!canUse(k))return;
  if(k==="ladder")return src==="belt"&&descend(true);
  arr.splice(i,1);let m;SE("belt",{k});
  if(HEAL[k]){const h=Math.max(1,Math.round(maxHp()*HEAL[k]));R.hp=Math.min(maxHp(),R.hp+h);m=`You drink the ${IT[k].n} and recover ${h} HP.`;sfx.guard()}
  else if(isWhet(k)){const b=WHET[whetRank(k)].b;R.atkB+=b;R.whetUsed=k;m=`You hone your blade with the ${IT[k].n}: +${Math.round(b*100)}% attack for this delve.`;sfx.craft()}
  else if(k==="rope"){m=`You yank the Escape Rope and vanish from the ${F.n}'s reach.`;if(F.kind==="boss"||F.kind==="voss")R.lair=true;R.fight=null;R.event=m;rlog(m);return save(),render()}
  else if(isBomb(k)){
    const d=bombDmg(k);F.hp-=d;sfx.hit();m=`The ${IT[k].n} explodes for ${d} damage!`;
    if(F.hp<=0)return winFight(m+" ");
    vossPhaseCheck();
  }
  if(F){m+=" "+monsterTurn(false);R.event=m;rlog(m);if(R.hp<=0)return faint()}
  else{R.event=m;rlog(m)}
  save();render();
}
function equip(k){if(S.belt.length>=beltCap()||!S.inv.includes(k))return;S.inv.splice(S.inv.indexOf(k),1);S.belt.push(k);sfx.loot();save();render()}
function unequip(i){if(S.belt[i]){S.inv.push(S.belt.splice(i,1)[0]);save();render()}}

/* ---------- Movement ---------- */
function descend(byLadder=false){
  const R=S.run,D=R&&DUN[R.d],ladder=byLadder?S.belt.indexOf("ladder"):-1;
  if(!R||R.fight||R.ev||R.secretFloor||R.floor>=D.floors||(!byLadder&&!R.stairs)||(byLadder&&ladder<0)||floorSealed(R.d,R.floor+1))return false;
  if(byLadder){S.belt.splice(ladder,1);SE("belt",{k:"ladder"})}
  R.floor++;R.stairs=false;R.steps=0;R.ev=null;R.left=null;R.dropSel=null;R.mod=byLadder?rollMod(R.floor):R.nextMod!==undefined?R.nextMod:rollMod(R.floor);delete R.nextMod;
  let m=byLadder?`You secure the Ladder and climb down to floor ${R.floor}.`:`You descend to floor ${R.floor}.`;
  if(sk("wind")){const h=Math.round(maxHp()*.15*sk("wind"));R.hp=Math.min(maxHp(),R.hp+h);m+=` Second Wind restores ${h} HP.`}
  if(R.mod)m+=` This floor is ${MODS[R.mod].n}.`;
  if(R.floor===DUN[R.d].floors)m+=" This is the deepest floor.";
  R.event=m;rlog(m);sfx.step();save();render();SE("floor",{d:R.d,floor:R.floor});return true;
}
function secretStairs(){
  const R=S.run;R.left=null;R.dropSel=null;R.floor=DUN[R.d].floors+1;R.secretFloor=true;R.secret=false;R.stairs=false;R.lair=false;R.mod=null;R.steps=0;
  R.ev={type:"chest"};
  R.event="You descend into a forgotten treasury. Strange relics glitter in the dust, and a locked chest waits nearby.";
  rlog(R.event);sfx.lvl();save();render();
}
function leaveDungeon(){
  const R=S.run;S.inv.push(...R.bag);
  const mats=Object.values(R.got).reduce((a,b)=>a+b,0);
  toast(`Back in town with <b>${R.bag.length}</b> item${R.bag.length===1?"":"s"}`+(mats?` and ${mats} material${mats===1?"":"s"}`:"")+".");
  endDay();
}
/* Fainting: lose everything found this run (items and materials) plus a share of gold that grows with depth. */
const faintPct=(floor=S.run?.floor||1)=>Math.min(.5,.05+.05*floor);
function faint(){
  const R=S.run,items=R.bag.length;let mats=0;
  for(const [k,n] of Object.entries(R.got||{})){const lost=Math.min(n,S.mats[k]||0);S.mats[k]=(S.mats[k]||0)-lost;mats+=lost}
  R.bag=[];R.got={};
  const pct=faintPct(R.floor),gold=Math.floor(S.gold*pct);S.gold-=gold;
  sfx.fail();
  const parts=[];if(items)parts.push(`${items} item${items===1?"":"s"}`);if(mats)parts.push(`${mats} material${mats===1?"":"s"}`);
  parts.push(`<b>${fmt(gold)}G</b> (${Math.round(pct*100)}% of your total gold)`);
  const lost=parts.length>1?parts.slice(0,-1).join(", ")+(parts.length>2?",":"")+" and "+parts.at(-1):parts[0];
  endDay();
  notice("You fainted",`You were dragged back to town. You lost ${lost}.`);
}

/* ================= Crafting ================= */
function canCraft(r){
  if(recipeLock(r))return false;
  return Object.entries(r.items).every(([k,n])=>count(S.inv,k)>=n)&&Object.entries(r.mats).every(([k,n])=>(S.mats[k]||0)>=n);
}
function craft(i){
  const r=RECIPES[i];if(!canCraft(r))return;
  Object.entries(r.items).forEach(([k,n])=>{for(let j=0;j<n;j++)S.inv.splice(S.inv.indexOf(k),1)});
  Object.entries(r.mats).forEach(([k,n])=>S.mats[k]-=n);
  const two=Math.random()<.2*sk("bulk");
  S.inv.push(r.out);if(two)S.inv.push(r.out);S.crafted++;
  const xp=xpm(Math.ceil(val(r.out)/20));
  sfx.craft();toast(`Crafted ${two?"<b>two</b> ":""}<b>${IT[r.out].n}</b> (worth about ${val(r.out)}G each) · +${xp} XP`);
  addXp(xp);SE("craft",{k:r.out,n:two?2:1});save();render();
}

/* ================= Reputation (earned at each Grand Reopening) ================= */
const PERKS=[
 {k:"fortune",n:"Family Fortune",max:5,base:1,d:r=>`Reopen with +${250*r}G → +${250*(r+1)}G on top of the startup loan`},
 {k:"xp",n:"Seasoned",max:5,base:1,d:r=>`+${10*r}% → +${10*(r+1)}% XP from everything`},
 {k:"heir",n:"Heirloom Gear",max:5,base:2,d:r=>`+${10*r}% → +${10*(r+1)}% attack and max HP`},
 {k:"name",n:"Renowned Name",max:5,base:2,d:r=>`+${5*r}% → +${5*(r+1)}% customer budgets`},
 {k:"pack",n:"Packrat",max:3,base:2,d:r=>`+${2*r} → +${2*(r+1)} pack space`},
 {k:"luck",n:"Lucky Finds",max:3,base:2,d:r=>`Rarer loot in every dungeon (rank ${r} → ${r+1})`},
 {k:"head",n:"Head Start",max:3,base:3,d:r=>`+${2*r} → +${2*(r+1)} bonus skill points`}
];
const pk=k=>S.legacy?.perks?.[k]||0;
const xpm=n=>Math.round(n*(1+.1*pk("xp")));
const lifeEarned=()=>Math.max(0,S.earned-(S.lifeStart||0));
const starsFromGold=()=>Math.floor(Math.sqrt(lifeEarned()/1500));
const starsNow=()=>starsFromGold()+Object.keys(S.bosses).length;
const perkCost=p=>p.base*(pk(p.k)+1);
function buyPerk(k){
  const p=PERKS.find(x=>x.k===k),L=S.legacy;if(!p||pk(k)>=p.max||L.stars<perkCost(p))return;
  L.stars-=perkCost(p);L.perks[k]=pk(k)+1;sfx.lvl();save();render();
}
/* ================= Skills ================= */
function learn(k){
  const s=SK.find(x=>x.k===k);
  if(pts()<1||sk(k)>=s.max||(s.req&&brSpent(s.b)<s.req)||(s.need&&!s.need()))return;
  S.skills[k]=sk(k)+1;sfx.lvl();save();render();
}

/* ================= Shop ================= */
const MOODS=[

const moodOf=c=>MOODS.find(m=>c.max/val(c.k)>=m.min);
/* Haggling styles (hidden): they set the opening offer, patience, counter-offers and whether a walk-out returns. */
const PERSONA={

};
function pickPersona(){let w=Math.random()*100;for(const k in PERSONA){w-=PERSONA[k].w;if(w<=0)return k}return "bluffer"}
const REGS={kid:["Little Wick","Pell and Posy"],town:["Old Tam","Widow Hessa","Farmer Bix"],adv:["Kesta the Bold","Brother Ulm","Rook"],
  trav:["Jory the Peddler","Saska from the next valley"],craft:["Ilse the cooper","Dob the tanner"],coll:["the Spoon Man","Madame Orsolya"],noble:["Lord Fenwick"],schol:["Professor Quill"]};
const regRec=n=>(S.regs[n]=S.regs[n]||{p:pickPersona(),trust:0,visits:0});
const cName=c=>c.reg?c.reg.replace(/^the /,"The "):"The "+CUST[c.t].n.toLowerCase();
const moodK=c=>c.mood||moodOf(c).k;
function openShop(){hlLeave(false);S.shop={left:custN(),cur:null,combo:0,today:0,log:[],pct:S.shop?.pct||130,served:0,back:[],regsToday:[]};SE("shopOpen");nextCust();save();render()}
function slog(m){S.shop.log.unshift(m);S.shop.log=S.shop.log.slice(0,6)}
function makeCustomer(C,k,forceReg){
  const P=S.shop;let reg=null;
  const pool=(REGS[C.k]||[]).filter(n=>!P.regsToday.includes(n));
  if(forceReg){reg=forceReg;P.regsToday.push(reg)}
  else if(pool.length&&Math.random()<.35){reg=pick(pool);P.regsToday.push(reg)}
  const R=reg?regRec(reg):null,per=R?R.p:pickPersona(),Pz=PERSONA[per];
  const max=Math.max(1,Math.round(val(k)*rnd(...C.bud)*signB()*Pz.maxMul*(1+.05*(R?R.trust:0))));
  const pat=Pz.pat+sk("patience");
  const c={t:CUST.indexOf(C),k,max,per,reg,pat,pmax:pat,counter:null,fb:"",phase:"offer",
    offer:Math.max(1,Math.round(max*rnd(...Pz.offer))),
    line:per==="bluffer"&&Math.random()<.6?pick(PERSONA.straight.lines):pick(Pz.lines),
    known:!!(R&&R.visits>0)};
  c.read=!c.known&&Math.random()<.3*sk("read");
  c.mood=moodOf(c).k;c.tell=pick(MOODS.find(m=>m.k===c.mood).tells);
  return c;
}
function endVisit(c){if(c.reg&&!c.counted){c.counted=true;regRec(c.reg).visits++}}
function nextCust(){
  const P=S.shop;P.cur=null;P.back=P.back||[];P.regsToday=P.regsToday||[];
  while(P.left>0){
    P.left--;P.served++;
    // The first collector after the Market Square opens is always the Spoon Man (once he finds something he wants).
    const spoon=CUST.find(c=>c.k==="coll"),spoonNext=!fl("spoonDone")&&spoon.need()&&forSale().some(k=>spoon.cats.includes(IT[k].c));
    let C=pickCust();if(spoonNext&&C.k==="coll")C=spoon;
    const m=forSale().filter(k=>!C.cats||C.cats.includes(IT[k].c));
    if(!m.length){slog(`A ${C.n.toLowerCase()} browsed but found nothing they wanted.`);continue}
    const rel=m.filter(x=>IT[x].sec);
    const k=C.k==="schol"&&rel.length?pick(rel):C.k==="noble"?m.reduce((a,b)=>val(b)>val(a)?b:a):pick(m);
    const first=spoonNext&&C===spoon;if(first)S.story.flags.spoonDone=S.day;
    P.cur=makeCustomer(C,k,first?"the Spoon Man":null);
    SE("customer",{type:C.k,mood:P.cur.mood,reg:!!P.cur.reg});
    return;
  }
  while(P.back.length){ // customers who walked out may come back after the last customer, with a better offer
    const c=P.back.shift();
    if(!S.inv.includes(c.k)){slog(`${cName(c)} came back, but the ${IT[c.k].n} was gone.`);continue}
    if(isKept(c.k)){slog(`${cName(c)} came back, but the ${IT[c.k].n} was no longer for sale.`);continue}
    Object.assign(c,{phase:"offer",back:true,pat:1,pmax:1,counter:null,fb:"",sus:false,lastAsk:null});
    c.offer=Math.min(c.max,Math.max(c.offer+1,Math.round(c.max*rnd(.9,.98))));
    P.cur=c;slog(`${cName(c)} came back!`);SE("returned");return;
  }
}
function sell(price){
  const P=S.shop,c=P.cur,v=val(c.k);
  const haggled=c.phase==="haggle";
  S.inv.splice(S.inv.indexOf(c.k),1);S.gold+=price;P.today+=price;S.earned+=price;S.sold++;
  const perfect=price/c.max>=.92;P.combo=perfect?P.combo+1:0;
  const x=xpm(Math.ceil(v/8*(1+.25*P.combo)));
  let note="";
  if(c.reg){const R=regRec(c.reg);
    if(price<=v*1.05){R.trust=Math.min(3,R.trust+1);note=` ${cName(c)} will remember the fair deal.`}
    else if(price>=c.max*.95&&price>v*1.15){R.trust=Math.max(-3,R.trust-1);note=` ${cName(c)} won't forget that price.`}}
  endVisit(c);
  slog(`Sold ${IT[c.k].n} for ${fmt(price)}G · +${x} XP${perfect?` · great price! combo ×${P.combo}`:""}${note}`);
  sfx.coin();if(perfect&&P.combo>1)toast(`Haggle combo <b>×${P.combo}</b> · bonus XP`);
  addXp(x);SE("sale",{above:price>v,haggled,price,type:CUST[c.t].k,reg:c.reg});nextCust();save();render();
  if(haggled)hagglePop(`Deal! +${fmt(price)}G`,"good");
}
function custLeaves(c,msg){const P=S.shop;slog(msg);endVisit(c);P.combo=0;sfx.fail();SE("walk");nextCust();save();render();hagglePop("No deal — they walked away","bad")}
function offer(){
  const P=S.shop,c=P.cur,v=val(c.k),price=Math.max(1,Math.round(v*P.pct/100));
  if(price<=c.max)return sell(price);
  const insult=price>c.max*1.3;
  const newlySus=!c.sus&&c.lastAsk&&price<c.lastAsk*.8;if(newlySus)c.sus=true;
  c.lastAsk=price;
  let cost=insult?2:1;const poker=Math.random()<.25*sk("poker");if(poker)cost=insult?1:0;
  c.pat-=cost;
  if(insult)SE("insult");if(newlySus)SE("suspicious");
  if(c.pat<=0)return custLeaves(c,`${cName(c)} left in a huff.`);
  c.fb=(insult?"\u201cThat's an insult!\u201d":price>c.max*1.1?"\u201cHmm, that's steep.\u201d":"\u201cJust a little lower...\u201d")
    +(poker&&cost<(insult?2:1)?" Your poker face holds.":"")+(c.sus?" They narrow their eyes: you came down awfully fast.":"");
  if(c.per==="straight"){c.counter=c.offer;c.fb+=" \u201cI said my price.\u201d"}
  else if(!(c.sus&&c.counter))c.counter=Math.max(c.counter||1,Math.round(Math.min(price-1,c.max*rnd(...(PERSONA[c.per].ctr||[.85,.97])))));
  sfx.hurt();save();render();
  hagglePop(insult?"Too high!":`Counteroffer: ${fmt(c.counter)}G`,insult?"bad":"");
}
function startHaggle(){
  const P=S.shop,c=P.cur;if(!c)return;const v=val(c.k);
  c.phase="haggle";c.counter=c.offer;
  P.pct=Math.max(50,Math.round(Math.max(v,c.offer)/v*100));
  save();render();
}
function letWalk(){
  const P=S.shop,c=P.cur;if(!c)return;P.combo=0;endVisit(c);
  if(!c.back&&Math.random()<PERSONA[c.per].back)P.back.push(c);
  slog(`${cName(c)} walked out.`);nextCust();save();render();
}
const sweetPick=c=>{const o=forSale().filter(x=>x!==c.k&&val(x)<=val(c.k)*.5);return o.length?o.reduce((a,b)=>val(b)<val(a)?b:a):null};
function pitchTalk(){
  const c=S.shop.cur;if(!c||c.pitched||c.phase!=="haggle")return;
  c.pitched=true;c.pat--;SE("pitch");
  if(c.pat<=0)return custLeaves(c,`${cName(c)} got bored of the sales pitch and left.`);

}

}
